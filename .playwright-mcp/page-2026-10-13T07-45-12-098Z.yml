          - text: •
          - paragraph [ref=f36e766]: Deduplication comparison panels
      - paragraph [ref=f36e767]: As the replay progresses, signal degradation events from the dataset become visible in near real time. Because GlassFlow has already filtered noise, removed duplicate observations, and normalized attributes, the dashboard reflects actual network conditions rather than artifacts introduced by the telemetry pipeline.
      - paragraph [ref=f36e768]:
