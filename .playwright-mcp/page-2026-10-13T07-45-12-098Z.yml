        - text: . You will be asked to set a new password on first login so please do so. Then, you can navigate to the Dashboards section where you should see the preconfigured dashboard.
      - paragraph [ref=f36e757]: "The dashboard provides a real-time view of the processed telemetry stream, including:"
      - list [ref=f36e758]:
        - listitem [ref=f36e759]:
          - text: •
          - paragraph [ref=f36e760]: Per-cell RSRP trends
