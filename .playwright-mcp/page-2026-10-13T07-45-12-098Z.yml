      - heading [level=2] [ref=f36e834]
      - heading "Frequently Asked Questions" [level=2] [ref=f36e835]
      - paragraph [ref=f36e836]:
        - strong [ref=f36e837]: What is OpenTelemetry (OTel)?
        - text: OpenTelemetry is an open-source observability framework that standardizes how telemetry data (metrics, logs, traces) is collected, instrumented, and exported. It's vendor-neutral and supported by all major cloud providers and observability vendors.
      - paragraph [ref=f36e838]:
        - strong [ref=f36e839]: What causes duplicate metrics in OpenTelemetry pipelines?
        - text: Duplicate metrics occur when redundant OpenTelemetry Collectors, deployed for high availability, each forward the same observation to the downstream backend. Without deduplication, a single measurement appears twice in storage, inflating counts and skewing aggregations.
      - paragraph [ref=f36e840]:
        - strong [ref=f36e841]: Why use GlassFlow instead of deduplicating in ClickHouse?
        - text: Deduplicating in ClickHouse (via ReplacingMergeTree) requires extra storage for duplicate rows before merges run, complicates query logic, and adds operational overhead. GlassFlow removes duplicates in the streaming layer before any data reaches ClickHouse, keeping the database simple and queries accurate from the start.
      - paragraph [ref=f36e842]:
        - strong [ref=f36e843]: What is RAN signal quality degradation?
        - text: RAN (Radio Access Network) signal quality degradation refers to a deterioration in the radio signal between a 5G base station (gNB) and a user device. It's measured via metrics such as RSRP (Reference Signal Received Power), RSRQ (Reference Signal Received Quality), and SNR (Signal-to-Noise Ratio). Degradation can indicate interference, coverage gaps, or hardware issues.
      - paragraph [ref=f36e844]:
        - strong [ref=f36e845]: What is OTLP?
        - text: OTLP (OpenTelemetry Protocol) is the native wire protocol used to transmit telemetry data between OpenTelemetry Collectors and backends. GlassFlow accepts OTLP natively, meaning no additional message queue (Kafka, Pulsar) is needed to connect OTel to GlassFlow.
      - paragraph [ref=f36e846]:
        - strong [ref=f36e847]: Can this pipeline work in production with real 5G infrastructure?
        - text: Yes. The architecture dual OTel Collectors → GlassFlow → ClickHouse mirrors production high-availability collector topologies. The main adjustments for production are sizing the deduplication window to match your collector batching intervals and tuning ClickHouse batch sizes.
