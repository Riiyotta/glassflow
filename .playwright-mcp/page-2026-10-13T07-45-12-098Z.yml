        - button "Copy code" [ref=f36e679] [cursor=pointer]: Copy
      - heading "Detect Signal Degradation" [level=3] [ref=f36e680]
      - paragraph [ref=f36e681]: One of the primary goals of the pipeline is to identify cells experiencing poor radio conditions.
      - paragraph [ref=f36e682]: "The following query calculates a rolling average RSRP value for each cell:"
