        - button "Copy code" [ref=f36e668] [cursor=pointer]: Copy
      - paragraph [ref=f36e669]:
        - text: If the pipeline is functioning correctly,
        - code [ref=f36e670]: surviving_dupes
        - text: "should be zero or very close to zero, confirming that duplicate observations emitted by the redundant collectors were removed before storage. You should see an output similar to this on your ClickHouse execution output:"
