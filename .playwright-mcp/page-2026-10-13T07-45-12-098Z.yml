      - 'heading "Results: What Upstream Deduplication Achieves" [level=2] [ref=f36e770]'
      - paragraph [ref=f36e771]: "This demo demonstrates three things:"
      - list [ref=f36e772]:
        - listitem [ref=f36e773]:
          - text: •
          - paragraph [ref=f36e774]: Duplicate observations emitted by redundant OpenTelemetry Collectors can be removed before they reach the analytics layer.
        - listitem [ref=f36e775]:
          - text: •
          - paragraph [ref=f36e776]: Vendor-specific attribute naming can be normalized into a consistent schema during stream processing.
        - listitem [ref=f36e777]:
          - text: •
          - paragraph [ref=f36e778]: An OTLP-native architecture is sufficient for real-time telemetry processing, eliminating the need for additional messaging infrastructure in this workflow.
      - paragraph [ref=f36e779]: It also demonstrates the operational value of upstream processing. By the time telemetry reaches ClickHouse, it is already filtered, deduplicated, and normalized, allowing dashboards and analytical queries to operate on clean data.
      - paragraph [ref=f36e780]:
        - text: At the same time, this is not the only valid approach. ClickHouse features such as
        - code [ref=f36e781]: ReplacingMergeTree
        - text: can also be used to address duplicate records in some workloads. This article focuses on upstream stream processing as an alternative that is particularly well-suited to high-volume telemetry pipelines.
      - paragraph [ref=f36e782]: Finally, while the telemetry traces come from a real-world 5G dataset, the dual-collector deployment is intentionally simulated. The goal is to reproduce the duplicate-emission patterns commonly seen in production high-availability collector topologies.
      - heading "Production Considerations for RAN Telemetry Pipelines" [level=2] [ref=f36e783]
      - paragraph [ref=f36e784]: "A few practical considerations are worth keeping in mind when adapting this pattern to production environments:"
      - list [ref=f36e785]:
        - listitem [ref=f36e786]:
          - text: •
          - paragraph [ref=f36e787]: Choose a deduplication window that comfortably covers collector batching, retries, and network latency.
        - listitem [ref=f36e788]:
          - text: •
          - paragraph [ref=f36e789]: Apply deduplication selectively. It provides the most value for high-volume telemetry streams where duplicate observations can significantly impact analytics.
        - listitem [ref=f36e790]:
          - text: •
          - paragraph [ref=f36e791]: Normalize attributes as early as possible to avoid carrying vendor-specific complexity into dashboards and queries.
        - listitem [ref=f36e792]:
          - text: •
          - paragraph [ref=f36e793]: "Treat stream processing and analytics as separate concerns: GlassFlow prepares the data, while ClickHouse focuses on storing and querying it efficiently."
      - 'heading "Conclusion: Clean Telemetry Starts at the Source" [level=2] [ref=f36e794]'
      - paragraph [ref=f36e795]: 5G observability pipelines generate large volumes of telemetry, but volume alone does not create useful insights. Duplicate observations, inconsistent schemas, and operational noise can all reduce the accuracy of downstream analytics.
      - paragraph [ref=f36e796]: In this tutorial, we used GlassFlow to process OpenTelemetry metrics before they reached ClickHouse. A simple pipeline—filtering health checks, removing duplicate observations, and normalizing attributes—turned a noisy telemetry stream into a trustworthy one.
      - paragraph [ref=f36e797]: "The broader lesson extends beyond telecommunications: cleaning data before it reaches the database is often simpler and more efficient than compensating for data quality issues afterward."
      - paragraph [ref=f36e798]:
        - text: If you'd like to try it yourself,
        - link "clone the demo repository" [ref=f36e799] [cursor=pointer]:
          - /url: https://github.com/glassflow/clickhouse-etl?utm_source=blog&utm_medium=website&utm_campaign=ran_5G_demo
        - text: ", replay the dataset, and compare the results with deduplication enabled and disabled. The difference becomes apparent almost immediately."
      - paragraph [ref=f36e800]:
        - text: Want to run GlassFlow in your own pipeline?
        - link "Get started here" [ref=f36e801] [cursor=pointer]:
