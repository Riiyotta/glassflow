        - button "Copy code" [ref=f36e531] [cursor=pointer]: Copy
      - paragraph [ref=f36e532]: "Finally, deploy the GlassFlow pipeline:"
      - generic [ref=f36e536]:
        - tabpanel [ref=f36e538]:
          - textbox "Code Editor for example.sh" [ref=f36e539]:
            - generic [ref=f36e540]: "# In a separate terminal make pf-glassflow-api # Main terminal make"
        - button "Copy code" [ref=f36e541] [cursor=pointer]: Copy
      - paragraph [ref=f36e542]: At this point, the entire environment is ready. The OpenTelemetry Collectors are configured to forward telemetry into GlassFlow, ClickHouse is ready to receive cleaned metrics, and Grafana is available for visualization.
      - paragraph [ref=f36e543]: Now let's examine the GlassFlow pipeline responsible for filtering, deduplicating, and normalizing the telemetry stream before it reaches storage.
      - heading "The GlassFlow Pipeline, End to End" [level=2] [ref=f36e544]
      - paragraph [ref=f36e545]: With the infrastructure in place, let's build the pipeline that processes the telemetry stream before it reaches ClickHouse.
      - paragraph [ref=f36e546]: The replay emitter sends every observation through two OpenTelemetry Collectors configured as a high-availability pair. Each collector exports the same signal-quality metrics to GlassFlow using OTLP. This creates the duplicate-emission pattern we discussed in the previous section and gives us a realistic stream to process.
      - heading "The OTLP Source" [level=3] [ref=f36e547]
      - paragraph [ref=f36e548]:
        - text: Both collectors export directly to
        - link "GlassFlow's OTLP endpoint" [ref=f36e549] [cursor=pointer]:
          - /url: https://docs.glassflow.dev/sources/otlp?utm_source=blog&utm_medium=website&utm_campaign=ran_5G_demo
        - text: . Because OTLP metrics have a predefined schema, GlassFlow automatically exposes fields such as metric names, timestamps, resource attributes, metric attributes, and values to downstream transformations.
      - paragraph [ref=f36e550]: Metrics flow directly from OpenTelemetry into GlassFlow using standard OTLP endpoints.
      - generic [ref=f36e554]:
        - tabpanel [ref=f36e556]:
          - textbox "Code Editor for example.yaml" [ref=f36e557]:
            - generic [ref=f36e558]: "exporters: otlp: endpoint: glassflow-glassflow:4317 headers: x-glassflow-pipeline-id: ran-5g-telemetry service: pipelines: metrics: exporters"
        - button "Copy code" [ref=f36e559] [cursor=pointer]: Copy
      - 'heading "6.2. Filter: Remove Health-Check Noise" [level=3] [ref=f36e560]'
      - paragraph [ref=f36e561]: The replay process injects synthetic health-check metrics alongside the real signal-quality telemetry. These metrics are useful for validating pipeline health but add no value to downstream analytics.
      - paragraph [ref=f36e562]: The first stage removes these records before they consume storage or processing resources.
      - generic [ref=f36e566]:
        - tabpanel [ref=f36e568]:
          - textbox "Code Editor for example.js" [ref=f36e569]:
            - generic [ref=f36e570]: "{ \"type\": \"filter\", \"source_id\": \"ran_metrics\", \"config\": { \"expression\": \"metric_name != 'ran.healthcheck'\" } }"
        - button "Copy code" [ref=f36e571] [cursor=pointer]: Copy
      - 'heading "6.3. Deduplication: Remove Duplicate Observations" [level=3] [ref=f36e572]'
      - paragraph [ref=f36e573]:
        - text: Each replayed observation carries a unique
        - code [ref=f36e574]: measurement_id
        - text: attribute. Since both collectors forward the same observation, the resulting metrics share the same identifier even though they arrive through different collection paths.
      - paragraph [ref=f36e575]:
        - text: GlassFlow uses this identifier to
        - link "remove duplicate observations" [ref=f36e576] [cursor=pointer]:
          - /url: https://docs.glassflow.dev/transformations/deduplication?utm_source=blog&utm_medium=website&utm_campaign=ran_5G_demo
        - text: within a 30-second window, ensuring that each measurement is written only once.
      - generic [ref=f36e580]:
        - tabpanel [ref=f36e582]:
          - textbox "Code Editor for example.js" [ref=f36e583]:
            - generic [ref=f36e584]: "{ \"type\": \"dedup\", \"source_id\": \"ran_metrics\", \"config\": { \"key\": \"attributes.measurement_id\", \"time_window\": \"30s\" } }"
        - button "Copy code" [ref=f36e585] [cursor=pointer]: Copy
      - 'heading "6.4. Stateless Transformation: Normalize Vendor Attributes" [level=3] [ref=f36e586]'
      - paragraph [ref=f36e587]: To simulate a multi-vendor environment, the two collectors intentionally emit different attribute names for the same cell identifier.
      - paragraph [ref=f36e588]: "For example:"
      - generic [ref=f36e592]:
        - tabpanel [ref=f36e594]:
          - textbox "Code Editor for example.md" [ref=f36e595]
        - button "Copy code" [ref=f36e597] [cursor=pointer]: Copy
      - paragraph [ref=f36e598]:
        - text: A
        - link "stateless transformation" [ref=f36e599] [cursor=pointer]:
          - /url: https://docs.glassflow.dev/transformations/stateless-transformation?utm_source=blog&utm_medium=website&utm_campaign=ran_5G_demo
        - text: reconciles these variations into a single canonical field that downstream systems can query consistently.
      - generic [ref=f36e603]:
        - tabpanel [ref=f36e605]:
          - textbox "Code Editor for example.js" [ref=f36e606]:
            - generic [ref=f36e607]: "{ \"type\": \"stateless\", \"source_id\": \"ran_metrics\", \"config\": { \"transforms\": [ { \"expression\": \"resource_attributes['cell.id'] ?? resource_attributes['ran.cell.id'] ?? resource_attributes['network.element.id']\", \"output_name\": \"canonical_cell_id\", \"output_type\": \"string\" } ] } }"
        - button "Copy code" [ref=f36e608] [cursor=pointer]: Copy
      - paragraph [ref=f36e609]: In addition to standardizing cell identifiers, the pipeline extracts commonly queried fields such as network mode, geographic coordinates, timestamps, and metric values into strongly typed columns that can be mapped directly into ClickHouse.
      - heading "6.5. ClickHouse Sink" [level=3] [ref=f36e610]
      - paragraph [ref=f36e611]: After filtering, deduplication, and normalization, the cleaned telemetry stream is written into ClickHouse.
      - paragraph [ref=f36e612]:
        - text: The
        - link "GlassFlow ClickHouse sink" [ref=f36e613] [cursor=pointer]:
          - /url: https://docs.glassflow.dev/configuration/clickhouse-sink?utm_source=blog&utm_medium=website&utm_campaign=ran_5G_demo
        - text: maps OpenTelemetry fields into typed ClickHouse columns while preserving the original attributes for ad-hoc analysis. This allows us to run efficient analytical queries without sacrificing access to the underlying telemetry context.
      - generic [ref=f36e617]:
        - tabpanel [ref=f36e619]:
          - textbox "Code Editor for example.js" [ref=f36e620]:
            - generic [ref=f36e621]: "{ \"type\": \"clickhouse\", \"table\": \"ran_metrics\", \"max_batch_size\": 1000, \"max_delay_time\": \"1s\", \"mapping\": [ { \"name\": \"canonical_cell_id\", \"column_name\": \"CellID\" }, { \"name\": \"metric_name\", \"column_name\": \"MetricName\" }, { \"name\": \"value_double\", \"column_name\": \"Value\" }, { \"name\": \"timestamp\", \"column_name\": \"TimeUnix\" } ] }"
        - button "Copy code" [ref=f36e622] [cursor=pointer]: Copy
      - heading "6.6. The Complete Pipeline" [level=3] [ref=f36e623]
      - paragraph [ref=f36e624]: "The complete processing flow consists of four transformations applied to every incoming metric:"
      - generic [ref=f36e628]:
        - tabpanel [ref=f36e630]:
          - textbox "Code Editor for example.md" [ref=f36e631]
        - button "Copy code" [ref=f36e633] [cursor=pointer]: Copy
      - paragraph [ref=f36e634]: "The full pipeline definition used in this demo is available in the repository:"
      - paragraph [ref=f36e635]: At this point, the environment is ready. The OpenTelemetry Collectors are forwarding telemetry into GlassFlow, ClickHouse is prepared to store the processed metrics, and Grafana is available for visualization. The next step is to examine how GlassFlow transforms the incoming stream—filtering noise, removing duplicate observations, and normalizing attributes before the data reaches storage.
      - 'heading "The ClickHouse Side: Queries, Validation, and Results" [level=2] [ref=f36e636]'
      - paragraph [ref=f36e637]: With the pipeline deployed and telemetry flowing, it's time to validate that the data arriving in ClickHouse is clean and ready for analysis.
      - paragraph [ref=f36e638]:
        - text: One of the advantages of performing deduplication upstream is that ClickHouse can use a simple
        - code [ref=f36e639]: MergeTree
        - text: table rather than relying on engines such as
        - code [ref=f36e640]: ReplacingMergeTree
        - text: to clean up duplicates after ingestion. The database receives already-processed telemetry, allowing queries to operate directly on the data rather than compensating for inconsistencies.
      - paragraph [ref=f36e641]: "Now, let’s port forward the desired ClickHouse services:"
      - generic [ref=f36e645]:
        - tabpanel [ref=f36e647]:
          - textbox "Code Editor for example.sh" [ref=f36e648]:
            - generic [ref=f36e649]: make
        - button "Copy code" [ref=f36e650] [cursor=pointer]: Copy
      - paragraph [ref=f36e651]:
        - text: Running this will port forward the client and the HTTP API services within Kubernetes. Now, you can open your browser and go to
        - link "http://localhost:8123" [ref=f36e652] [cursor=pointer]:
          - /url: http://localhost:8123/
        - text: and click on the Web SQL UI to execute queries and get your results.
      - img "ClickHouse Web SQL UI showing RAN metrics query results at localhost:8123" [ref=f36e653]
      - paragraph [ref=f36e654]:
        - emphasis [ref=f36e655]:
          - strong [ref=f36e656]: Figure 4
          - text: . ClickHouse Web SQL UI showing RAN metrics query results at localhost:8123
      - heading "Verify Deduplication" [level=3] [ref=f36e657]
      - paragraph [ref=f36e658]: The first validation step is confirming that duplicate observations have been removed successfully.
      - paragraph [ref=f36e659]: "Run the following query:"
      - generic [ref=f36e663]:
        - tabpanel [ref=f36e665]:
          - textbox "Code Editor for example.sql" [ref=f36e666]:
