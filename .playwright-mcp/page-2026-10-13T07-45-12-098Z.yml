      - heading "Measuring the Impact of Deduplication (Optional)" [level=3] [ref=f36e716]
      - paragraph [ref=f36e717]: To demonstrate why deduplication matters, the demo includes a second pipeline that intentionally preserves duplicate observations.
      - paragraph [ref=f36e718]: "Deploy the no-dedup pipeline:"
      - generic [ref=f36e722]:
        - tabpanel [ref=f36e724]:
          - textbox "Code Editor for example.sh" [ref=f36e725]:
            - generic [ref=f36e726]: make deploy-pipeline-no-dedup make switch-collectors-no-dedup make
        - button "Copy code" [ref=f36e727] [cursor=pointer]: Copy
      - paragraph [ref=f36e728]: "Then compare row counts against unique measurements:"
      - generic [ref=f36e732]:
        - tabpanel [ref=f36e734]:
          - textbox "Code Editor for example.sql" [ref=f36e735]:
            - generic [ref=f36e736]: SELECT CellID, count() AS rows, uniqExact(Attributes['measurement_id']) AS unique_measurements, count() / greatest(uniqExact(Attributes['measurement_id']), 1) AS inflation_factor FROM ran_metrics WHERE MetricName = 'ran.rsrp' GROUP BY CellID ORDER BY inflation_factor DESC LIMIT 6
        - button "Copy code" [ref=f36e737] [cursor=pointer]: Copy
      - paragraph [ref=f36e738]:
        - text: With deduplication disabled, the inflation factor approaches
        - code [ref=f36e739]: "2.0"
        - text: because both collectors write the same observation. Once the deduplicated pipeline is restored, the inflation factor returns to
        - code [ref=f36e740]: "1.0"
        - text: .
      - paragraph [ref=f36e741]: "This comparison illustrates the core value of the pipeline: analytics are only as trustworthy as the telemetry feeding them"
