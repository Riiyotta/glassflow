      - heading "How Duplicate Telemetry Distorts 5G RAN Analytics" [level=2] [ref=f36e481]
      - paragraph [ref=f36e482]: Our 5G telemetry stream flows through two OpenTelemetry Collectors configured for high availability. While this improves reliability, it also means the same metric can be exported twice.
      - paragraph [ref=f36e483]:
        - text: For example, both collectors may observe and forward the same signal-quality measurement. Although both exports are valid, they represent a single observation and should only be counted once (
        - emphasis [ref=f36e484]: Refer to Figure 1 for a visual explanation of this concept
        - text: ).
      - paragraph [ref=f36e485]: Hence, without deduplication, these duplicates can skew aggregations and add noise to dashboards. To address this, we'll use GlassFlow to remove duplicate observations before they reach ClickHouse. Because collectors may export data at slightly different times due to batching, retries, or network delays, we'll use a 30-second deduplication window to catch delayed duplicates.
      - paragraph [ref=f36e486]: In the next section, we'll build the GlassFlow pipeline that performs this deduplication and prepares the data for storage.
      - 'heading "Deploying the Demo: Kubernetes + Helm Setup" [level=2] [ref=f36e487]'
      - paragraph [ref=f36e488]: To demonstrate the complete workflow, we'll deploy a local environment containing GlassFlow, ClickHouse, Grafana, two OpenTelemetry Collectors, and a telemetry emitter that replays the 5G dataset as live OTLP metrics.
      - paragraph [ref=f36e489]: "All components run inside a local Kubernetes cluster and can be deployed with a few commands from the demo directory:"
