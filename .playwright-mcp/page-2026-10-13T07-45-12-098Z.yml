        - img "5G RAN Signal Quality Monitoring with OTel, GlassFlow & ClickHouse" [ref=f36e273]
    - generic [ref=f36e279]:
      - link [ref=f36e280] [cursor=pointer]:
        - /url: https://www.glassflow.ai/
      - blockquote [ref=f36e281]:
        - paragraph [ref=f36e282]:
          - emphasis [ref=f36e283]: "TL;DR: This tutorial shows how to process 5G RAN telemetry from OpenTelemetry Collectors through GlassFlow (deduplication + schema normalization) into ClickHouse for real-time signal quality analytics using a real-world dataset of 188,711 measurements across 274 cells"
          - text: .
      - paragraph [ref=f36e284]: Modern 5G networks generate an enormous volume of telemetry. Every cell continuously reports signal-quality indicators such as Reference Signal Received Power (RSRP), Reference Signal Received Quality (RSRQ), Signal-to-Noise Ratio (SNR), and throughput measurements that operators use to monitor network health. These metrics power everything from SLA reporting and capacity planning to anomaly detection and troubleshooting degraded user experiences.
      - paragraph [ref=f36e285]: The challenge is that telemetry rarely arrives as a single clean stream.
      - paragraph [ref=f36e286]: Large telecom deployments often use redundant OpenTelemetry Collectors to improve reliability, but this can result in duplicate metric emissions reaching the analytics backend. At the same time, multi-vendor environments introduce inconsistent attribute naming, while synthetic health checks add operational noise. Together, these issues can distort the telemetry operators rely on.
      - paragraph [ref=f36e287]:
        - strong [ref=f36e288]: For radio access network (RAN) monitoring, the impact is significant
        - text: . Duplicate measurements can inflate counts and skew throughput calculations, making it harder to accurately identify signal degradation, capacity issues, and other network problems.
      - paragraph [ref=f36e289]: In this article, we'll build an end-to-end pipeline that ingests 5G signal-quality metrics through OpenTelemetry, processes them with GlassFlow, and stores the cleaned stream in ClickHouse for real-time analytics.
      - paragraph [ref=f36e290]:
        - strong [ref=f36e291]: GlassFlow
        - text: is a stream processing platform that sits between your telemetry sources and analytics backends. It accepts OTLP metrics natively and lets you apply transformations (deduplication, filtering, schema normalization) before data reaches storage. Check our open source repository
        - link "here" [ref=f36e292] [cursor=pointer]:
          - /url: https://github.com/glassflow/clickhouse-etl
        - text: .
      - paragraph [ref=f36e293]: "Using a real-world 5G dataset containing nearly 189,000 measurements across 274 cells, we'll simulate a production-style collector topology and demonstrate how GlassFlow can:"
      - list [ref=f36e294]:
        - listitem [ref=f36e295]:
          - text: •
          - paragraph [ref=f36e296]: Deduplicate overlapping metric emissions from redundant collectors
        - listitem [ref=f36e297]:
          - text: •
          - paragraph [ref=f36e298]: Normalize vendor-specific attribute schemas into a canonical format
        - listitem [ref=f36e299]:
          - text: •
          - paragraph [ref=f36e300]: Filter synthetic health-check traffic before it reaches storage
        - listitem [ref=f36e301]:
          - text: •
          - paragraph [ref=f36e302]: Deliver clean, trustworthy telemetry to ClickHouse with sub-minute latency
      - paragraph [ref=f36e303]: The result is a per-cell observability dashboard that highlights genuine signal degradation trends without double-counting metrics or forcing expensive cleanup operations inside the database.
      - heading "What you’ll learn" [level=3] [ref=f36e304]
      - paragraph [ref=f36e305]: "By the end of this article, you will know how to:"
      - list [ref=f36e306]:
        - listitem [ref=f36e307]:
          - text: •
          - paragraph [ref=f36e308]: Remove duplicate metric emissions from redundant OpenTelemetry Collectors
        - listitem [ref=f36e309]:
          - text: •
          - paragraph [ref=f36e310]: Normalize vendor-specific attribute schemas using GlassFlow stateless transforms
        - listitem [ref=f36e311]:
          - text: •
          - paragraph [ref=f36e312]: Filter health-check noise from your telemetry stream
        - listitem [ref=f36e313]:
          - text: •
          - paragraph [ref=f36e314]: Store clean, analysis-ready metrics in ClickHouse using a simple MergeTree table
        - listitem [ref=f36e315]:
          - text: •
          - paragraph [ref=f36e316]: Detect signal degradation events with ClickHouse SQL queries
      - heading "Why OpenTelemetry Alone Doesn't Solve This" [level=2] [ref=f36e317]
      - paragraph [ref=f36e318]: OpenTelemetry makes it easy to collect and transport telemetry, but it doesn't guarantee that the data arriving at your analytics platform is clean (check out the figure below).
      - img "Diagram showing redundant OpenTelemetry Collectors forwarding duplicate 5G RAN telemetry to downstream analytics systems" [ref=f36e319]
      - paragraph [ref=f36e320]:
        - emphasis [ref=f36e321]:
          - strong [ref=f36e322]: Figure 1.
          - text: Redundant OpenTelemetry Collectors forwarding identical RAN telemetry to downstream analytics systems.
      - paragraph [ref=f36e323]: In telecom environments, redundant OpenTelemetry Collectors are commonly deployed to prevent data loss. The same 5G signal-quality measurement can be forwarded by multiple collectors, creating duplicate records downstream. For metrics such as RSRP, RSRQ, SNR, and throughput, these duplicates can distort aggregations, dashboards, and SLA reporting.
      - paragraph [ref=f36e324]: There's also the challenge of consistency. Different network vendors often use different attribute names for the same entities, making cross-network analysis more difficult than it should be.
      - paragraph [ref=f36e325]: These issues aren't unique to the telecommunications industry. They're common in large observability deployments. OpenTelemetry standardizes telemetry collection, but tasks such as deduplication, schema normalization, and noise filtering still need to happen somewhere in the pipeline.
      - paragraph [ref=f36e326]: In this article, we'll clean the telemetry stream before it reaches ClickHouse using GlassFlow, ensuring that downstream analytics are built on accurate and consistent data.
      - 'heading "The Architecture: OpenTelemetry → GlassFlow → ClickHouse" [level=2] [ref=f36e327]'
      - paragraph [ref=f36e328]: For this demo, we'll simulate a fleet of 5G cells continuously reporting signal-quality metrics such as RSRP, RSRQ, SNR, and throughput. The telemetry is exported through two OpenTelemetry Collectors configured as a high-availability pair, mirroring the redundant collector topologies commonly used in production environments.
      - paragraph [ref=f36e329]:
        - strong [ref=f36e330]: Both collectors forward metrics to GlassFlow using the OpenTelemetry Protocol (OTLP)
        - text: . Rather than storing the data immediately, GlassFlow processes the stream first, removing duplicate observations, filtering unwanted telemetry, and standardizing attributes into a consistent schema.
      - paragraph [ref=f36e331]:
        - strong [ref=f36e332]: "Behind the Scenes: How GlassFlow Processes OTLP Metrics"
      - blockquote [ref=f36e333]:
        - paragraph [ref=f36e334]: "When OTLP metrics arrive, GlassFlow converts each metric data point into a stream record that can be processed by transformations. The pipeline we'll build applies four operations in sequence:"
        - list [ref=f36e335]:
          - listitem [ref=f36e336]:
            - paragraph [ref=f36e337]:
              - strong [ref=f36e338]: Create a deduplication key
              - text: from the metric identity.
          - listitem [ref=f36e339]:
            - paragraph [ref=f36e340]:
              - strong [ref=f36e341]: Remove duplicate observations
              - text: arriving from redundant collectors.
          - listitem [ref=f36e342]:
            - paragraph [ref=f36e343]:
              - strong [ref=f36e344]: Filter health-check telemetry
              - text: that adds noise but no analytical value.
          - listitem [ref=f36e345]:
            - paragraph [ref=f36e346]:
              - strong [ref=f36e347]: Normalize vendor-specific attributes
              - text: into a common schema.
        - paragraph [ref=f36e348]: The final result is a clean stream of per-cell metrics that can be written directly into ClickHouse for analytics.
      - paragraph [ref=f36e349]: Once the stream has been cleaned, the resulting records are written to ClickHouse, where they can be queried in near real time and visualized through Grafana dashboards.
      - paragraph [ref=f36e350]: "The resulting architecture will be as follows:"
      - paragraph [ref=f36e351]:
        - emphasis [ref=f36e352]:
          - strong [ref=f36e353]: Figure 2. End-to-end OpenTelemetry pipeline for processing 5G signal-quality metrics.
          - text: GlassFlow sits between OpenTelemetry and ClickHouse, applying deduplication, filtering, and schema normalization before the data reaches storage.
      - paragraph [ref=f36e354]:
        - text: Processing the stream before it reaches ClickHouse allows us to store clean telemetry from the start. Unlike relying on ClickHouse's
        - code [ref=f36e355]: ReplacingMergeTree
        - text: engine to clean duplicates post-ingestion, GlassFlow removes them upstream, reducing write amplification and simplifying ClickHouse table design. As metrics flow through GlassFlow, duplicate observations are removed, irrelevant telemetry is filtered out, and vendor-specific attributes are normalized into a consistent schema.
      - paragraph [ref=f36e356]: By performing these operations in the streaming layer, we ensure that only high-quality, analysis-ready data is written to ClickHouse, reducing storage overhead and simplifying downstream queries.
      - 'heading "The Dataset: Real 5G Traces, Real Signal Degradation" [level=2] [ref=f36e357]'
      - paragraph [ref=f36e358]: To make the demo realistic, we'll use the publicly available 5G dataset from the University College Cork Mobile and Internet Systems Laboratory (UCCMISL). The dataset contains real-world mobile network measurements collected using G-NetTrack Pro across Cork, Ireland and includes nearly 189,000 observations spanning 83 CSV files.
      - paragraph [ref=f36e359]:
        - text: Dataset repository
        - link "here" [ref=f36e360] [cursor=pointer]:
          - /url: https://github.com/uccmisl/5Gdataset
        - text: ":"
      - paragraph [ref=f36e361]: What makes this dataset useful for observability demonstrations is that it captures real-world variations in mobile network quality, including changes in signal strength, throughput, and network conditions. The traces include both static and driving scenarios, allowing us to observe realistic degradation events, handovers, and transitions between 5G and LTE.
      - paragraph [ref=f36e362]: For this article, we'll replay the measurements as a live telemetry stream. Each row is converted into OpenTelemetry metrics and emitted through a pair of OpenTelemetry Collectors, creating realistic duplicate telemetry patterns. We also inject a small amount of synthetic noise and schema variation to show how GlassFlow performs deduplication and data cleaning before the data reaches ClickHouse.
