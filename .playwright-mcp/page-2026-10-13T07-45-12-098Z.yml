        - tabpanel [ref=f36e689]:
          - textbox "Code Editor for example.sh" [ref=f36e690]:
            - generic [ref=f36e691]: "Query id: 74324bee-e7a5-40d9-ac38-3319397423ad ┌──────────────minute─┬─CellID─┬────────────avg_rsrp─┐ 1. │ 2019-12-16 12:33:00 │ 3 │ -111 │ 2. │ 2019-12-16 12:33:00 │ 41 │ -114 │ 3. │ 2019-12-14 10:27:00 │ 3 │ -110.14285714285714 │ 4. │ 2019-12-14 10:26:00 │ 3 │ -111.06451612903226 │ 5. │ 2019-12-14 10:25:00 │ 3 │ -200 │ 6. │ 2019-11-29 10:17:00 │ 12 │ -113.81818181818181 │ 7. │ 2019-11-29 09:57:00 │ 1 │ -112.63636363636364 │ 8. │ 2019-11-29 09:56:00 │ 1 │ -111.79069767441861 │ 9. │ 2019-11-29 09:55:00 │ 1 │ -111 │ 10. │ 2019-11-29 09:46:00 │ 1 │ -112"
        - button "Copy code" [ref=f36e692] [cursor=pointer]: Copy
      - heading "Throughput SLA Validation" [level=3] [ref=f36e693]
      - paragraph [ref=f36e694]: Signal strength alone doesn't tell the whole story. Operators also care about the user experience delivered by the network.
      - paragraph [ref=f36e695]: "The following query calculates the 95th percentile downlink throughput for each cell:"
      - generic [ref=f36e699]:
