    - generic [ref=f32e196]:
      - paragraph [ref=f32e197]:
        - text: Today, we’re over the moon to share some huge news –
        - strong [ref=f32e198]: GlassFlow has officially raised its seed round!
        - text: This journey has been intense, rewarding, and so much bigger than we ever imagined when we first set out. Our round was led by the amazing team at Upfront Ventures, with support from High-Tech Gründerfonds, Robin Capital, TinyVC, and a group of excellent angels from Weaviate, Redis, Sentry, Atlar, Sequence, and many more.
      - heading "The (Many) Pain Points That Led Us Here" [level=2] [ref=f32e199]
      - paragraph [ref=f32e200]: "This all started in early 2023 when Ashish and I were in a room with our friend, telling us all the horror stories he experienced when building applications that heavily depend on data streaming. As he shared story after story, we realized that our (painful) experience with event-driven pipelines wasn’t unique. So that was it; we knew we had to tackle this for real, and we poured ourselves into building GlassFlow: The Python solution for event-driven data pipelines."
      - paragraph [ref=f32e201]: "We knew the pain out there. Data teams everywhere are up against big challenges just to keep up with the demands of event-driven applications: AI recommendations, predictive maintenance, dynamic pricing, and more. Building and maintaining pipelines that can handle this data flow isn’t just a technical challenge – it’s a massive drain on resources and time. Mid-size companies easily spend 6–9 months getting a setup running, with their data engineers spending half their time on maintenance alone."
      - heading "The Problem? Most Tools aren’t built for data people" [level=2] [ref=f32e202]
      - paragraph [ref=f32e203]: "Most existing tools are geared for languages like Java and Scala, putting backend engineers and the DevOps team at the pole position in creating event pipelines. That’s totally fine, as long as the pipelines are only focused on event distribution, but when it comes to data-driven use cases, those are mainly built and managed by data teams, and they live clearly in the Python world (the #1 program language in data). Now you can imagine what's happening. Python devs are forced to create their own inefficient, hard-to-maintain solutions. That's the moment GlassFlow enters the room."
      - 'heading "GlassFlow: The Event-Driven Pipeline Platform Built Just for Python Devs" [level=2] [ref=f32e204]'
      - paragraph [ref=f32e205]: For us, it was clear. When we build a solution for event-driven data pipelines, it needs to be in Python. Python devs who don’t want to spend months managing infrastructure. With GlassFlow, you get a fully managed, Python-native streaming platform. That means serverless execution, pre-built connectors, and instant setup, which lets data teams get full pipelines up and running in minutes. It’s designed to help Python developers focus on their ideas, not infrastructure headaches.
      - heading "Users are getting updated from batch to stream in no time" [level=2] [ref=f32e206]
      - paragraph [ref=f32e207]: When talking to our users, one pattern was very clear. The reason why they want to use GlassFlow is the promise of being able to realize use cases much quicker than ever before. How often have we heard data engineers telling us that they can’t get the approvals from the management because seeing the ROI will take too long? So, their brilliant ideas are getting deprioritized again and again. With a solution built from scratch with simplicity in mind, new possibilities are being created. Nearly everyone in the data team can create event-driven pipelines and realize those use cases. Bringing the data stack of the teams from batch to streaming in no time.
      - heading "So, What’s Next for Us?" [level=2] [ref=f32e208]
      - paragraph [ref=f32e209]: "With this new funding and our incredible team, we have what we need to take GlassFlow even further. We’re working on some very cool updates: letting teams host GlassFlow on their own cloud, adding new transformation functions, and rethinking the experience to make event streaming easier than ever. This is just the start, and we can’t wait to share what’s next with you."
      - paragraph [ref=f32e210]: With all the excitement,
      - paragraph [ref=f32e211]: GlassFlow Founders
      - paragraph [ref=f32e212]
      - img "GlassFlow Founders Armend and Ashish together.jpg" [ref=f32e213]
