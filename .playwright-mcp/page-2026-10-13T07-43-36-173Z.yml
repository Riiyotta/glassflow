      - heading "Why Venn Diagrams Can Be Misleading" [level=3] [ref=f28e356]
      - paragraph [ref=f28e357]:
        - text: While helpful for initial understanding, Venn diagrams are technically inaccurate for explaining SQL JOINs. Venn diagrams illustrate
        - emphasis [ref=f28e358]: set operations
        - text: like
        - code [ref=f28e359]: UNION
        - text: ","
        - code [ref=f28e360]: INTERSECT
        - text: ", and"
        - code [ref=f28e361]: EXCEPT
        - text: ", which operate on sets of elements of the same type. A SQL JOIN is fundamentally different. It is not a set operation but a"
        - strong [ref=f28e362]: filtered Cartesian product
        - text: .
      - paragraph [ref=f28e363]: "Here is a more accurate mental model:"
      - list [ref=f28e364]:
        - listitem [ref=f28e365]:
          - paragraph [ref=f28e366]:
            - strong [ref=f28e367]: Cartesian Product (
            - code [ref=f28e368]:
              - strong [ref=f28e369]: CROSS JOIN
            - strong [ref=f28e370]: )
            - text: ": First, the database engine conceptually creates a massive intermediate table by pairing every single row from the left table with every single row from the right table. If"
            - code [ref=f28e371]: Table_A
            - text: has 1,000 rows and
            - code [ref=f28e372]: Table_B
            - text: has 1,000 rows, the
            - code [ref=f28e373]: CROSS JOIN
            - text: produces 1,000,000 rows.
        - listitem [ref=f28e374]:
          - paragraph [ref=f28e375]:
            - strong [ref=f28e376]: Filtering (
            - code [ref=f28e377]:
              - strong [ref=f28e378]: "ON"
            - strong [ref=f28e379]: clause)
            - text: ": Next, the engine filters this huge intermediate table, keeping only the rows where the condition in the"
            - code [ref=f28e380]: "ON"
            - text: clause is true (e.g.,
            - code [ref=f28e381]: Table_A.key = Table_B.key
            - text: ).
      - paragraph [ref=f28e382]:
        - text: This model correctly explains why a
        - code [ref=f28e383]: JOIN
        - text: can sometimes produce
        - emphasis [ref=f28e384]: more
        - text: rows than exist in either of the original tables. If a key in
        - code [ref=f28e385]: Table_A
        - text: matches three keys in
        - code [ref=f28e386]: Table_B
        - text: ", the final result will include three rows for that single key from"
        - code [ref=f28e387]: Table_A
        - text: . A Venn diagram cannot represent this multiplicative behavior. Understanding this "Cartesian Product -> Filter" mechanism is the key to mastering JOINS, especially in a high-performance database like ClickHouse.
      - heading "ClickHouse JOIN" [level=2] [ref=f28e388]
      - paragraph [ref=f28e389]:
        - text: ClickHouse supports all standard SQL
        - code [ref=f28e390]: JOIN
        - text: types and enhances them with specialized modifiers and entirely new
        - code [ref=f28e391]: JOIN
        - text: types designed for analytical workloads. These are not just syntactic sugar; they are purpose-built tools that can dramatically improve query performance and solve specific analytical problems.
      - 'heading "Strictness Modifiers: ANY and ALL" [level=3] [ref=f28e392]'
      - paragraph [ref=f28e393]:
        - text: In standard SQL, JOINs implicitly use
        - code [ref=f28e394]: ALL
        - text: strictness. This means if a single row from the left table matches multiple rows in the right table, all possible combinations are returned, forming a Cartesian product for those matching keys. While this is sometimes necessary, it can lead to an explosion in result set size and is often inefficient for simple data enrichment.
      - paragraph [ref=f28e395]:
        - text: ClickHouse introduces the
        - code [ref=f28e396]: ANY
        - text: strictness modifier as a powerful optimization. An
        - code [ref=f28e397]: ANY JOIN
        - text: returns only the
        - strong [ref=f28e398]: first found matching row
        - text: from the right table for each key from the left table, effectively disabling the Cartesian product.
      - paragraph [ref=f28e399]:
        - text: This makes
        - code [ref=f28e400]: ANY JOIN
        - text: exceptionally fast and memory-efficient for lookup scenarios. For example, if enriching an
        - code [ref=f28e401]: orders
        - text: table with customer names from a
        - code [ref=f28e402]: customers
        - text: table, an
        - code [ref=f28e403]: ANY JOIN
        - text: is ideal because each order belongs to only one customer, and only one name needs to be attached.
      - generic [ref=f28e407]:
        - tabpanel [ref=f28e409]:
          - textbox "Code Editor for example.sql" [ref=f28e410]:
            - generic [ref=f28e411]: CREATE TABLE users ( user_id UInt32, name String ) ENGINE = Memory; CREATE TABLE logins ( user_id UInt32, login_time DateTime ) ENGINE = Memory; INSERT INTO users VALUES (1, 'Alice'), (2, 'Bob'); INSERT INTO logins VALUES (1, '2023-10-26 10:00:00'), (1, '2023-10-27 11:00:00'), (2, '2023-10-26 12:00:00')
        - button "Copy code" [ref=f28e412] [cursor=pointer]: Copy
      - paragraph [ref=f28e413]:
        - text: Now, let's compare
        - code [ref=f28e414]: LEFT ALL JOIN
        - text: (the default) with
        - code [ref=f28e415]: LEFT ANY JOIN
        - text: .
      - paragraph [ref=f28e416]:
        - strong [ref=f28e417]: Query with
        - code [ref=f28e418]:
          - strong [ref=f28e419]: ALL
        - strong [ref=f28e420]: "strictness (implicit):"
