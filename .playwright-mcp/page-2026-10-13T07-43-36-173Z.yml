              - columnheader [ref=f28e796]:
                - paragraph [ref=f28e797]: Recommended Algorithm
              - columnheader [ref=f28e798]:
                - paragraph [ref=f28e799]: Key Consideration
            - row [ref=f28e800]:
              - cell [ref=f28e801]:
                - paragraph [ref=f28e802]: My right table is a small, frequently used key-value lookup table.
              - cell [ref=f28e803]:
                - paragraph [ref=f28e804]:
                  - strong [ref=f28e805]: Direct Join
              - cell [ref=f28e806]:
                - paragraph [ref=f28e807]: Requires pre-configuring the right table as a ClickHouse Dictionary. Offers the absolute best performance.
            - row [ref=f28e808]:
              - cell [ref=f28e809]:
                - paragraph [ref=f28e810]: My right table is small to medium-sized and fits comfortably in RAM.
              - cell [ref=f28e811]:
                - paragraph [ref=f28e812]:
                  - strong [ref=f28e813]: Parallel Hash Join
