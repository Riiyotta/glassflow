          - textbox "Code Editor for example.sql" [ref=f28e427]:
            - generic [ref=f28e428]: SELECT u.name, l.login_time FROM users AS u LEFT JOIN logins AS l ON
        - button "Copy code" [ref=f28e429] [cursor=pointer]: Copy
