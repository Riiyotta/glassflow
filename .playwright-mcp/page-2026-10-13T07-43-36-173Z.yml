                - paragraph [ref=f28e831]: A flexible non-memory-bound option that spills to disk. Performance is tunable.
            - row [ref=f28e832]:
              - cell [ref=f28e833]:
                - paragraph [ref=f28e834]: I have extremely limited memory, and performance is a secondary concern.
              - cell [ref=f28e835]:
                - paragraph [ref=f28e836]:
                  - strong [ref=f28e837]: Partial Merge Join
              - cell [ref=f28e838]:
                - paragraph [ref=f28e839]: The slowest of the non-memory-bound options but uses the least amount of RAM.
      - 'heading "Performance Playbook: Optimizing Your ClickHouse JOINs" [level=2] [ref=f28e840]'
      - paragraph [ref=f28e841]:
        - text: Unlike traditional databases with highly sophisticated, cost-based optimizers, ClickHouse
        - code [ref=f28e842]: JOIN
        - text: performance benefits immensely from thoughtful query design and manual tuning. The core principle behind nearly every optimization is to
        - strong [ref=f28e843]: reduce the amount of data processed at every stage of the query
        - text: . The following practices are a playbook for writing efficient JOINs.
      - list [ref=f28e844]:
        - listitem [ref=f28e845]:
          - text: •
          - paragraph [ref=f28e846]:
            - strong [ref=f28e847]: "The Golden Rule: Smaller Table on the Right"
            - text: ": For hash-based joins, ClickHouse builds an in-memory hash table from the right-hand side of the"
            - code [ref=f28e848]: JOIN
            - text: . Therefore, always place the smaller of the two tables on the right. This minimizes the memory required for the hash table and reduces the time spent in the "Build Phase". While recent versions of ClickHouse (24.12+) have a query planner that can automatically reorder tables, understanding this principle is fundamental to writing performant JOINs.
        - listitem [ref=f28e849]:
          - text: •
          - paragraph [ref=f28e850]:
            - strong [ref=f28e851]: Avoid Cartesian Products with
            - code [ref=f28e852]:
              - strong [ref=f28e853]: ANY JOIN
            - text: ": As discussed earlier, if a join key in the left table matches multiple rows in the right table, a standard ("
            - code [ref=f28e854]: ALL
            - text: )
            - code [ref=f28e855]: JOIN
            - text: will return all combinations. For data enrichment or lookup tasks where only a single match is needed, using
            - code [ref=f28e856]: ANY JOIN
            - text: is the single most effective optimization. It prevents the result set from exploding in size and is significantly faster and less memory-intensive.
        - listitem [ref=f28e857]:
          - text: •
          - paragraph [ref=f28e858]:
            - strong [ref=f28e859]: Filter Early and Often
            - text: ": Reduce the amount of data entering the"
            - code [ref=f28e860]: JOIN
            - text: operation by applying filters in the
            - code [ref=f28e861]: WHERE
            - text: clause as early as possible. ClickHouse's query planner attempts to "push down" predicates to the underlying tables before the join, but explicitly filtering both tables in subqueries or with
            - code [ref=f28e862]: WHERE
            - text: conditions is a robust practice that guarantees less data is processed by the join algorithm.
          - list [ref=f28e863]:
            - listitem [ref=f28e864]:
              - text: •
              - paragraph [ref=f28e865]: Inefficient (JOIN first, then filter)
          - generic [ref=f28e869]:
            - tabpanel [ref=f28e871]:
              - textbox "Code Editor for example.sql" [ref=f28e872]:
                - generic [ref=f28e873]: SELECT... FROM large_table_A AS a JOIN large_table_B AS b ON a.id = b.id WHERE a.date = '2023-01-01'
            - button "Copy code" [ref=f28e874] [cursor=pointer]: Copy
          - list [ref=f28e875]:
            - listitem [ref=f28e876]:
              - text: •
              - paragraph [ref=f28e877]: Efficient (Filter first, then JOIN)
          - generic [ref=f28e881]:
            - tabpanel [ref=f28e883]:
              - textbox "Code Editor for example.sql" [ref=f28e884]:
                - generic [ref=f28e885]: SELECT... FROM (SELECT * FROM large_table_A WHERE date = '2023-01-01') AS a JOIN large_table_B AS b ON
            - button "Copy code" [ref=f28e886] [cursor=pointer]: Copy
        - listitem [ref=f28e887]:
          - text: •
          - paragraph [ref=f28e888]:
            - strong [ref=f28e889]: Use
            - code [ref=f28e890]:
              - strong [ref=f28e891]: IN
            - strong [ref=f28e892]: Instead of
            - code [ref=f28e893]:
              - strong [ref=f28e894]: JOIN
            - strong [ref=f28e895]: for Existence Checks
            - text: ": When the goal is simply to filter one table based on the existence of keys in another (the use case for"
            - code [ref=f28e896]: SEMI JOIN
            - text: ), using a
            - code [ref=f28e897]: WHERE... IN (subquery)
            - text: clause is often much faster. The
            - code [ref=f28e898]: IN
            - text: operator only needs to build a hash set of the keys from the subquery and check for existence, avoiding the overhead of retrieving and combining columns from the right table.
        - listitem [ref=f28e899]:
          - text: •
          - paragraph [ref=f28e900]:
            - strong [ref=f28e901]: Optimize Join Key Data Types
            - text: ": The performance of a"
            - code [ref=f28e902]: JOIN
            - text: is sensitive to the data types of the join keys. Use the smallest integer types possible (e.g.,
            - code [ref=f28e903]: UInt32
            - text: instead of
            - code [ref=f28e904]: UInt64
            - text: if the cardinality allows). Avoid
            - code [ref=f28e905]: Nullable
            - text: types for join keys unless absolutely necessary, as they introduce extra overhead for handling
            - code [ref=f28e906]: "NULL"
            - text: values.
        - listitem [ref=f28e907]:
          - text: •
          - paragraph [ref=f28e908]:
            - strong [ref=f28e909]: Leverage Sorting Keys for Merge Joins
            - text: ": If two large tables are frequently joined on the same set of columns, a powerful optimization is to include those columns in the"
            - code [ref=f28e910]: ORDER BY
            - text: clause of both
            - code [ref=f28e911]: CREATE TABLE
            - text: statements. This physically sorts the data on disk by those keys. When a
            - code [ref=f28e912]: full_sorting_merge
            - text: join is later performed on these keys, ClickHouse can skip the expensive in-memory or external sorting step, resulting in a very fast and memory-efficient join.
        - listitem [ref=f28e913]:
          - text: •
          - paragraph [ref=f28e914]:
            - strong [ref=f28e915]: Understand Distributed Joins (
            - code [ref=f28e916]:
              - strong [ref=f28e917]: GLOBAL JOIN
            - strong [ref=f28e918]: )
            - text: ": In a distributed ClickHouse cluster, a standard"
            - code [ref=f28e919]: JOIN
            - text: is executed locally on each shard. Each shard builds a right-hand table using only its local data. This is often not the desired behavior. To join a large, sharded table (on the left) with a smaller dimension table (on the right), use
            - code [ref=f28e920]: GLOBAL... JOIN
            - text: . This syntax instructs the initiator node to first compute the
            - emphasis [ref=f28e921]: entire
            - text: right-hand table, broadcast this complete table to every shard, and then perform the join on each shard against the full dimension table.
      - heading "Navigating the Limitations" [level=2] [ref=f28e922]
      - paragraph [ref=f28e923]: No database is a universal solution, and ClickHouse's design choices, which make it exceptionally fast for its core use cases, also introduce certain limitations for JOINs. Understanding these limitations is key to avoiding common pitfalls and working effectively with the database's architecture. These are not arbitrary flaws but rather the logical consequences of a design optimized for speed on single-table analytical scans.
      - list [ref=f28e924]:
        - listitem [ref=f28e925]:
          - text: •
          - paragraph [ref=f28e926]:
            - strong [ref=f28e927]: Rule-Based Query Planner
            - text: ": Historically, ClickHouse has used a rule-based query planner. Unlike a cost-based planner that analyzes data statistics to find the most efficient execution path, a rule-based planner follows a fixed set of heuristics. This can sometimes lead to suboptimal plans for complex queries with multiple JOINs, which is why manual tuning (like ordering tables and filtering early) is so crucial. It should be noted that ClickHouse is actively developing a more advanced, cost-based planner known as the \"Analyzer\" to mitigate this."
        - listitem [ref=f28e928]:
          - text: •
          - paragraph [ref=f28e929]:
            - strong [ref=f28e930]: Memory Consumption and Guardrails
            - text: ": The default hash-based join algorithms are memory-intensive. If the right-hand table is too large to fit in the available RAM, the query will fail with an \"out of memory\" error by default. To prevent this, ClickHouse provides \"guardrail\" settings like"
            - code [ref=f28e931]: max_rows_in_join
            - text: and
            - code [ref=f28e932]: max_bytes_in_join
            - text: ", which will cause the query to fail gracefully if a"
            - code [ref=f28e933]: JOIN
            - text: operation exceeds these thresholds. These settings prevent server instability but require the user to either provision more memory, filter the data more aggressively, or switch to a non-memory-bound algorithm like
            - code [ref=f28e934]: Grace Hash Join
            - text: or
            - code [ref=f28e935]: Partial Merge Join
            - text: .
        - listitem [ref=f28e936]:
          - text: •
          - paragraph [ref=f28e937]:
            - strong [ref=f28e938]: Distributed
            - code [ref=f28e939]:
              - strong [ref=f28e940]: JOIN
            - strong [ref=f28e941]: Challenges
            - text: ": ClickHouse's distributed execution model is designed for \"shared-nothing\" parallelism, where each node works independently on its local data to minimize network communication. This is highly efficient for aggregations but presents a challenge for"
            - code [ref=f28e942]: JOIN
            - text: s. ClickHouse does not support "data shuffling," a process used by systems like Apache Spark where data is dynamically repartitioned and sent between nodes to co-locate matching join keys. The absence of shuffling is a trade-off for faster execution of single-table distributed queries. The workaround for many distributed
            - code [ref=f28e943]: JOIN
            - text: scenarios is the
            - code [ref=f28e944]: GLOBAL JOIN
            - text: syntax, which involves a potentially large, one-time broadcast of the right table to all nodes.
        - listitem [ref=f28e945]:
          - text: •
          - paragraph [ref=f28e946]:
            - strong [ref=f28e947]: Restrictions on Join Keys
            - text: ": There are several specific restrictions on the types of conditions and data used in join keys:"
          - list [ref=f28e948]:
            - listitem [ref=f28e949]:
              - text: •
              - paragraph [ref=f28e950]:
                - strong [ref=f28e951]: Inequality Conditions
                - text: ": Conditions using operators like"
                - code [ref=f28e952]: ">"
                - text: or
                - code [ref=f28e953]: <
                - text: are only supported by the
                - code [ref=f28e954]: hash
                - text: and
                - code [ref=f28e955]: grace_hash
                - text: join algorithms and are incompatible with the
                - code [ref=f28e956]: join_use_nulls
                - text: setting.
            - listitem [ref=f28e957]:
              - text: •
              - paragraph [ref=f28e958]:
                - strong [ref=f28e959]: NULL Handling
                - text: ": By default,"
                - code [ref=f28e960]: "NULL"
                - text: values in a join key do not match anything, including other
                - code [ref=f28e961]: "NULL"
                - text: values. This is standard SQL behavior but can be surprising to newcomers.
            - listitem [ref=f28e962]:
              - text: •
              - paragraph [ref=f28e963]:
                - strong [ref=f28e964]: Type Compatibility
                - text: ": ClickHouse can perform implicit type casting on join keys, but the"
                - code [ref=f28e965]: JOIN
                - text: will fail if there is no common, compatible data type. For instance, a
                - code [ref=f28e966]: JOIN
                - text: between a
                - code [ref=f28e967]: String
                - text: and an
                - code [ref=f28e968]: Int32
                - text: key is not possible.
      - paragraph [ref=f28e969]:
        - text: To learn more see our
        - link "previous article" [ref=f28e970] [cursor=pointer]:
          - /url: ./clickhouse-limitations-joins
        - text: .
      - heading "Conclusion" [level=2] [ref=f28e971]
      - paragraph [ref=f28e972]: JOINs in ClickHouse are a deep and powerful feature, reflecting the database's evolution from a specialized analytics engine to a more comprehensive data warehouse. While ClickHouse's columnar architecture and performance philosophy will always favor denormalized, flat table structures, its robust support for JOINs provides the critical flexibility needed for modern, complex analytical applications.
      - paragraph [ref=f28e973]: Mastering JOINs in this environment requires a shift in mindset away from the patterns of traditional OLTP databases. Success hinges on a strategic approach that acknowledges the underlying mechanics of the system.
      - paragraph [ref=f28e974]: "The key takeaways are:"
      - list [ref=f28e975]:
        - listitem [ref=f28e976]:
          - paragraph [ref=f28e977]:
            - strong [ref=f28e978]: Denormalize by Default, Join by Design
            - text: ": Start with denormalization as the primary strategy for high-performance, high-concurrency workloads. Use JOINs deliberately for data enrichment, ad-hoc analysis, or where the complexity of maintaining a denormalized view is too high."
        - listitem [ref=f28e979]:
          - paragraph [ref=f28e980]:
            - strong [ref=f28e981]: Use the Right Tool for the Job
            - text: ": Go beyond standard JOINs. Leverage ClickHouse's specialized toolkit—use"
            - code [ref=f28e982]: ANY JOIN
            - text: for fast lookups,
            - code [ref=f28e983]: ASOF JOIN
            - text: for time-series analysis, and
            - code [ref=f28e984]: SEMI
            - text: /
            - code [ref=f28e985]: ANTI JOIN
            - text: for efficient filtering.
        - listitem [ref=f28e986]:
          - paragraph [ref=f28e987]:
            - strong [ref=f28e988]: Understand the Engine Room
            - text: ": The choice of"
            - code [ref=f28e989]: JOIN
            - text: algorithm is a critical performance lever. Understand the trade-offs between the speed of in-memory
            - code [ref=f28e990]: Hash
            - text: joins and the resilience of disk-spilling
            - code [ref=f28e991]: Grace Hash
            - text: and
            - code [ref=f28e992]: Merge
            - text: joins. Guide the planner when necessary.
        - listitem [ref=f28e993]:
          - paragraph [ref=f28e994]:
            - strong [ref=f28e995]: Optimize Aggressively
            - text: ": Performance is in the user's hands. Aggressively reduce the data being joined by filtering early, using the smallest possible key types, and always placing the smaller table on the right side of the"
            - code [ref=f28e996]: JOIN
            - text: .
      - paragraph [ref=f28e997]:
        - text: The ClickHouse team is continuously improving
        - code [ref=f28e998]: JOIN
        - text: performance, with recent releases introducing a more intelligent query planner and faster algorithms. By combining these ongoing platform enhancements with the principles and techniques outlined in this guide, developers and analysts can confidently and effectively harness the full power of JOINs to build sophisticated, high-performance analytical systems on ClickHouse.
