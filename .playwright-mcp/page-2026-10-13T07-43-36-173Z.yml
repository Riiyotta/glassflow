      - heading "A Peak Under the Hood at JOIN Algorithms" [level=2] [ref=f28e728]
      - paragraph [ref=f28e729]:
        - text: The performance of a
        - code [ref=f28e730]: JOIN
        - text: in ClickHouse depends not only on its
        - emphasis [ref=f28e731]: type
        - text: (
        - code [ref=f28e732]: INNER
        - text: ","
        - code [ref=f28e733]: LEFT
        - text: ", etc.) but critically on the underlying"
        - emphasis [ref=f28e734]: algorithm
        - text: used to execute it. ClickHouse features a number of
        - link "join algorithm" [ref=f28e735] [cursor=pointer]:
          - /url: https://clickhouse.com/blog/clickhouse-fully-supports-joins-part1
        - text: ", each with distinct trade-offs between memory consumption and execution speed. While ClickHouse can often select an appropriate algorithm automatically (by setting"
        - code [ref=f28e736]: join_algorithm = 'auto'
        - text: ), understanding these mechanisms empowers users to make informed tuning decisions for complex queries.
      - 'heading "The Default Workhorse: Hash-Based Joins" [level=3] [ref=f28e737]'
      - paragraph [ref=f28e738]: Hash-based algorithms are the most common and versatile in ClickHouse. They operate by building an in-memory hash table (similar to a dictionary or map) of the right-hand table, which allows for very fast lookups.
      - list [ref=f28e739]:
        - listitem [ref=f28e740]:
          - text: •
          - paragraph [ref=f28e741]:
            - strong [ref=f28e742]: Hash Join
            - text: ": This is the most generic algorithm and supports all"
            - code [ref=f28e743]: JOIN
            - text: "types. It follows a two-phase process:"
          - list [ref=f28e744]:
            - listitem [ref=f28e745]:
              - paragraph [ref=f28e746]:
                - strong [ref=f28e747]: Build Phase
                - text: ": The entire right-hand table is streamed into memory, and a hash table is constructed using the join key(s) as the hash keys."
            - listitem [ref=f28e748]:
              - paragraph [ref=f28e749]:
                - strong [ref=f28e750]: Probe Phase
                - text: ": The left-hand table is streamed row by row and joined by doing lookups into the hash table."
        - listitem [ref=f28e751]:
          - text: •
          - paragraph [ref=f28e752]:
            - strong [ref=f28e753]: Parallel Hash Join
            - text: ": This is an enhancement of the standard"
            - code [ref=f28e754]: Hash Join
            - text: . The "Build Phase" is parallelized across multiple CPU cores, which significantly speeds up the creation of the hash table for larger right-side tables. However, this comes at the cost of higher peak memory consumption.
        - listitem [ref=f28e755]:
          - text: •
          - paragraph [ref=f28e756]:
            - strong [ref=f28e757]: Grace Hash Join
            - text: ": This is the solution for when the right-hand table is too large to fit into memory. It is a non-memory-bound algorithm that avoids failure by \"spilling\" data to temporary storage on disk. It partitions both tables into smaller buckets using a hash function and then performs a standard"
            - code [ref=f28e758]: Hash Join
            - text: on each pair of corresponding buckets that can fit in memory.
      - 'heading "Leveraging Order: Merge-Based Join" [level=3] [ref=f28e759]'
      - paragraph [ref=f28e760]: Merge-based algorithms are designed to be highly efficient when data is sorted on the join key.
      - list [ref=f28e761]:
        - listitem [ref=f28e762]:
          - text: •
          - paragraph [ref=f28e763]:
            - strong [ref=f28e764]: Full Sorting Merge Join
            - text: ": This algorithm first ensures both the left and right tables are sorted by the join key. It then merges the two sorted streams in a single, efficient pass, much like merging two sorted lists. Its most powerful feature is an optimization: if a table is already physically sorted on disk by its primary key (defined in the"
            - code [ref=f28e765]: ORDER BY
            - text: clause of the
            - code [ref=f28e766]: CREATE TABLE
            - text: statement), the expensive sorting step for that table can be skipped entirely. This can make it extremely fast and memory-efficient.
        - listitem [ref=f28e767]:
          - text: •
          - paragraph [ref=f28e768]:
            - strong [ref=f28e769]: Partial Merge Join
            - text: ": This algorithm is optimized for scenarios with very low memory. It always fully sorts the right table to disk and creates on-disk indexes for it. It then reads the left table block by block, sorts each block in memory, and uses the indexes to efficiently join with the corresponding data from the right table on disk. It is generally slower but has the lowest memory footprint of the non-memory-bound algorithms."
      - 'heading "The Ultimate Speed: Direct Join" [level=3] [ref=f28e770]'
      - paragraph [ref=f28e771]:
        - text: The
        - code [ref=f28e772]: Direct Join
        - text: is the fastest algorithm available but comes with specific prerequisites. It completely eliminates the "Build Phase" of a hash join.
      - list [ref=f28e773]:
        - listitem [ref=f28e774]:
          - text: •
          - paragraph [ref=f28e775]:
            - strong [ref=f28e776]: How it Works
            - text: ": This algorithm can only be used when the right-hand table is a data structure that already supports fast key-value lookups, such as a ClickHouse"
            - strong [ref=f28e777]: Dictionary
            - text: ", a table using the"
            - code [ref=f28e778]: Join
            - text: engine, or
            - code [ref=f28e779]: EmbeddedRocksDB
            - text: . Because the key-value map is already built and loaded in memory, the
          - paragraph [ref=f28e780]:
            - code [ref=f28e781]: JOIN
            - text: becomes a series of highly optimized direct lookups as the left table is streamed.
        - listitem [ref=f28e782]:
          - text: •
          - paragraph [ref=f28e783]:
            - strong [ref=f28e784]: Limitations
            - text: ": Its primary limitation is that it generally only supports"
            - code [ref=f28e785]: LEFT ANY JOIN
            - text: semantics, as key-value structures like dictionaries typically enforce unique keys.
      - heading "Choosing the Right JOIN Algorithm" [level=3] [ref=f28e786]
      - paragraph [ref=f28e787]:
        - text: The choice of algorithm is a direct negotiation with the physical constraints of the system, primarily RAM and disk I/O. The hierarchy from
        - code [ref=f28e788]: Direct Join
        - text: down to
        - code [ref=f28e789]: Partial Merge Join
        - text: represents a spectrum of trade-offs between performance and flexibility. The following table provides a practical guide for selecting an algorithm based on common scenarios.
      - figure [ref=f28e790]:
        - table [ref=f28e791]:
          - rowgroup [ref=f28e792]:
            - row [ref=f28e793]:
              - columnheader [ref=f28e794]:
