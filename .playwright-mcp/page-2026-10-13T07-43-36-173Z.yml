      - heading "Why JOINs in a Columnar World?" [level=2] [ref=f28e221]
      - paragraph [ref=f28e222]:
        - text: ClickHouse is an open-source, column-oriented database management system (DBMS) engineered for online analytical processing (OLAP). Its architecture is built for speed, capable of processing billions of rows and terabytes of data to generate analytical reports in milliseconds. This performance stems from its columnar storage model. Unlike traditional row-based databases that store all values for a single row together, ClickHouse stores all values for a single column together. This design is revolutionary for analytical queries because it enables the database to read only the specific columns required for a query, thereby drastically reducing disk I/O and accelerating aggregations such as
        - code [ref=f28e223]: SUM
        - text: ","
        - code [ref=f28e224]: AVG
        - text: ", and"
        - code [ref=f28e225]: COUNT
        - text: .
      - paragraph [ref=f28e226]:
        - text: To achieve this lightning-fast performance, the recommended data modeling practice in ClickHouse is
        - strong [ref=f28e227]: denormalization
        - text: . This approach involves creating large, wide, "flat" tables that contain all the information needed for analysis in a single place. By pre-joining data during the ingestion or ETL (Extract, Transform, Load) process, denormalization eliminates the need for expensive JOIN operations at query time, leading to simpler and faster query execution.
      - paragraph [ref=f28e228]: However, pure denormalization is not always practical. It can lead to significant data redundancy, increased storage costs, and complex data update logic, as a single piece of information might need to be changed in many rows. In contrast, a normalized schema, which separates data into distinct logical tables (e.g., orders, customers, products), offers greater flexibility, easier data management, and reduced redundancy. This is where JOINs become essential.
      - paragraph [ref=f28e229]: Contrary to some misconceptions, JOINs are fully supported in ClickHouse, which offers a rich toolkit of standard and specialized JOIN types. However, consider them a powerful feature to use strategically, rather than a default data modeling tool. The extensive development of multiple JOIN types and sophisticated execution algorithms within ClickHouse is a clear acknowledgment that real-world applications often demand the flexibility that JOINs provide, especially for ad-hoc exploratory analysis or when denormalization is prohibitively complex. This guide will navigate the landscape of ClickHouse JOINs, teaching how to use this powerful capability effectively by understanding its unique characteristics, performance implications, and underlying mechanics.
      - heading "A Refresher on Standard SQL JOINs" [level=2] [ref=f28e230]
      - paragraph [ref=f28e231]: Before diving into the specifics of ClickHouse, it is crucial to have a solid foundation in standard SQL JOINs. A JOIN clause is used to combine rows from two or more tables based on a related column between them, known as a join key. A popular way to visualize JOINs is with Venn diagrams, which represent tables as overlapping circles. While intuitive, this analogy has limitations that I will address shortly.
      - paragraph [ref=f28e232]: Also, I will be using the following two tables for the examples.
      - paragraph [ref=f28e233]: Product Table
