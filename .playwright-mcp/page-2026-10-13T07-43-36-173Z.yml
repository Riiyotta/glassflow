      - paragraph [ref=f28e464]:
        - text: For simple lookups,
        - code [ref=f28e465]: ANY JOIN
        - text: is the clear winner in terms of performance and memory usage.
      - 'heading "Filtering JOIN: SEMI and ANTI" [level=3] [ref=f28e466]'
      - paragraph [ref=f28e467]:
        - text: Sometimes, the goal is not to combine columns but to filter one table based on the contents of another. ClickHouse provides two highly efficient
        - code [ref=f28e468]: JOIN
        - text: "types for this purpose:"
        - code [ref=f28e469]: SEMI JOIN
        - text: and
        - code [ref=f28e470]: ANTI JOIN
        - text: .
      - list [ref=f28e471]:
        - listitem [ref=f28e472]:
          - text: •
          - paragraph [ref=f28e473]:
            - code [ref=f28e474]:
              - strong [ref=f28e475]: SEMI JOIN
            - text: ": Returns rows from the left table for which a matching key"
            - strong [ref=f28e476]: exists
            - text: in the right table. It does not add any columns from the right table and, like
            - code [ref=f28e477]: ANY JOIN
            - text: ", returns each left-side row only once, even if there are multiple matches on the right. This is often a more performant alternative to a"
          - paragraph [ref=f28e478]:
            - code [ref=f28e479]: WHERE... IN (SELECT...)
            - text: subquery.
        - listitem [ref=f28e480]:
          - text: •
          - paragraph [ref=f28e481]:
            - code [ref=f28e482]:
              - strong [ref=f28e483]: ANTI JOIN
            - text: ": The logical opposite of"
            - code [ref=f28e484]: SEMI JOIN
            - text: . It returns rows from the left table for which
            - strong [ref=f28e485]: no matching key exists
            - text: in the right table. This is an efficient way to perform a
          - paragraph [ref=f28e486]:
            - code [ref=f28e487]: NOT EXISTS
            - text: or a
            - code [ref=f28e488]: LEFT JOIN... WHERE right_table.key IS NULL
            - text: operation.
      - paragraph [ref=f28e489]:
        - text: To illustrate this feature, let’s create
        - code [ref=f28e490]: products
        - text: and
        - code [ref=f28e491]: sales
        - text: tables.
      - generic [ref=f28e495]:
        - tabpanel [ref=f28e497]:
          - textbox "Code Editor for example.sql" [ref=f28e498]:
            - generic [ref=f28e499]: CREATE TABLE products ( product_id UInt32, product_name String ) ENGINE = Memory; CREATE TABLE sales ( sale_id UInt32, product_id UInt32, quantity UInt32 ) ENGINE = Memory; INSERT INTO products VALUES (101, 'Laptop'), (102, 'Mouse'), (103, 'Keyboard'); INSERT INTO sales VALUES (1, 101, 2), (2, 101, 1), (3, 103, 5)
        - button "Copy code" [ref=f28e500] [cursor=pointer]: Copy
      - paragraph [ref=f28e501]:
        - strong [ref=f28e502]: "LEFT SEMI JOIN: Find all products that have been sold"
      - generic [ref=f28e506]:
        - tabpanel [ref=f28e508]:
          - textbox "Code Editor for example.sql" [ref=f28e509]:
            - generic [ref=f28e510]: SELECT product_name FROM products p LEFT SEMI JOIN sales s ON
