        - tabpanel [ref=f28e576]:
          - textbox "Code Editor for example.sql" [ref=f28e577]:
            - generic [ref=f28e578]: CREATE TABLE trades ( symbol String, trade_time DateTime, volume UInt32 ) ENGINE = Memory; CREATE TABLE quotes ( symbol String, quote_time DateTime, price Float32 ) ENGINE = Memory; INSERT INTO trades VALUES ('CHDB', '2023-11-15 10:00:05', 100), ('CHDB', '2023-11-15 10:00:12', 50); INSERT INTO quotes VALUES ('CHDB', '2023-11-15 10:00:00', 150.00), ('CHDB', '2023-11-15 10:00:10', 150.50)
        - button "Copy code" [ref=f28e579] [cursor=pointer]: Copy
      - paragraph [ref=f28e580]: Now let’s find the price for each trade based on the most recent quote at the time of the trade.
      - generic [ref=f28e584]:
        - tabpanel [ref=f28e586]:
          - textbox "Code Editor for example.sql" [ref=f28e587]:
            - generic [ref=f28e588]: SELECT t.symbol, t.trade_time, t.volume, q.price AS trade_price FROM trades AS t ASOF LEFT JOIN quotes AS q ON t.symbol = q.symbol AND
        - button "Copy code" [ref=f28e589] [cursor=pointer]: Copy
