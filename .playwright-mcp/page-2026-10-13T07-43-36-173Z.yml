      - 'heading "A Special Case: Unnesting with ARRAY JOIN" [level=3] [ref=f28e606]'
      - paragraph [ref=f28e607]:
        - text: While it uses the
        - code [ref=f28e608]: JOIN
        - text: keyword,
        - code [ref=f28e609]: ARRAY JOIN
        - text: is not a traditional join between two tables. Instead, it is a powerful operator that "unfolds" or "unnests" an array column, creating a new row for each element in the array while duplicating the values in all other columns.
      - paragraph [ref=f28e610]:
        - text: This is extremely useful for analyzing data stored in arrays. For example, if a table of articles has a column
        - code [ref=f28e611]: tags Array(String)
