      - 'heading "Time-Series Magic: ASOF JOIN" [level=3] [ref=f28e550]'
      - paragraph [ref=f28e551]:
        - text: The
        - code [ref=f28e552]: ASOF JOIN
        - text: is a specialized tool designed for time-series analysis. It performs a non-exact match, joining rows from the left table with the row from the right table that has the
        - strong [ref=f28e553]: closest preceding timestamp
        - text: (or any other ordered numeric key).
      - paragraph [ref=f28e554]:
        - text: Its syntax requires two types of conditions in the
        - code [ref=f28e555]: "ON"
        - text: "clause:"
      - list [ref=f28e556]:
        - listitem [ref=f28e557]:
          - paragraph [ref=f28e558]:
            - text: An
            - strong [ref=f28e559]: exact match condition
            - text: on one or more keys (e.g.,
            - code [ref=f28e560]: ON trades.symbol = quotes.symbol
            - text: ).
        - listitem [ref=f28e561]:
          - paragraph [ref=f28e562]:
            - text: A
            - strong [ref=f28e563]: closest match condition
            - text: on an ordered key, typically a timestamp (e.g.,
            - code [ref=f28e564]: AND trades.time >= quotes.time
            - text: ).
      - paragraph [ref=f28e565]:
        - text: This is invaluable for scenarios like attaching a stock quote to a trade, where the quote's timestamp will almost never exactly match the trade's timestamp.
        - code [ref=f28e566]: ASOF JOIN
        - text: finds the last valid quote
        - emphasis [ref=f28e567]: before
        - text: the trade occurred.
      - paragraph [ref=f28e568]:
        - text: Let's create
        - code [ref=f28e569]: trades
        - text: and
        - code [ref=f28e570]: quotes
        - text: tables.
