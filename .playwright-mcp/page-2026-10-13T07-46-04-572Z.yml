      - generic [ref=f44e86]:
        - paragraph [ref=f44e95]: “GlassFlow helped eliminate silent failures in our pipelines. Dead-letter queues and pipeline metrics significantly improved reliability while keeping everything self-hosted.”
        - generic [ref=f44e100]:
          - paragraph [ref=f44e102]: Ingo Marquardt,
          - paragraph [ref=f44e104]: CTO, Nubrain
      - heading "Results" [level=2] [ref=f44e108]
      - paragraph [ref=f44e109]: "With GlassFlow in production, Nubrain achieved:"
      - list [ref=f44e110]:
        - listitem [ref=f44e111]:
          - text: •
          - paragraph [ref=f44e112]: Correct and consistent metrics due to stateful transformations and deduplication logic.
        - listitem [ref=f44e113]:
          - text: •
          - paragraph [ref=f44e114]: 93% reduction of silently duplicated or corrupted metrics that previously passed through the pipeline (measured in production pipelines).
        - listitem [ref=f44e115]:
          - text: •
          - paragraph [ref=f44e116]: Reliable handling of stateful streaming logic at scale.
        - listitem [ref=f44e117]:
          - text: •
          - paragraph [ref=f44e118]: 3x improved scalability as agent throughput increased.
        - listitem [ref=f44e119]:
          - text: •
          - paragraph [ref=f44e120]: Clear visibility into pipeline behavior and failures.
        - listitem [ref=f44e121]:
          - text: •
          - paragraph [ref=f44e122]: Stable processing of approximately 7 TB of data per day.
      - paragraph [ref=f44e123]: By introducing state into the pipeline, Nubrain was able to trust their metrics again and operate production AI workloads with significantly lower operational risk.
      - heading "Key takeaways:" [level=2] [ref=f44e124]
      - list [ref=f44e125]:
        - listitem [ref=f44e126]:
          - text: •
          - paragraph [ref=f44e127]: Eliminated silent metric corruption using stateful streaming transformations and deduplication
        - listitem [ref=f44e128]:
          - text: •
          - paragraph [ref=f44e129]: Scaled AI pipelines 3x with reliable observability while processing 7 TB of data per day
      - heading "The Challenge" [level=2] [ref=f44e130]
      - paragraph [ref=f44e131]: Nubrain’s initial data infrastructure was built on Kafka, a Kafka table engine, and self-written transformation code before ingesting to ClickHouse.
      - paragraph [ref=f44e132]: "While this setup worked for early experimentation, it exposed several fundamental limitations in production:"
      - list [ref=f44e133]:
        - listitem [ref=f44e134]:
          - text: •
          - paragraph [ref=f44e135]:
            - strong [ref=f44e136]: No support for stateful transformations
            - text: . Custom transformation code was largely stateless, making it difficult to correctly handle retries, aggregations, and validation over time windows.
        - listitem [ref=f44e137]:
          - text: •
          - paragraph [ref=f44e138]:
            - strong [ref=f44e139]: Limited scalability
            - text: . As agent activity increased, retries and reprocessing caused unpredictable load and operational overhead.
        - listitem [ref=f44e140]:
          - text: •
          - paragraph [ref=f44e141]:
            - strong [ref=f44e142]: Poor observability
            - text: . The team had limited insight into what was happening inside the pipeline, especially when data was dropped, retried, or silently corrupted.
        - listitem [ref=f44e143]:
          - text: •
          - paragraph [ref=f44e144]:
            - strong [ref=f44e145]: Silent data issues
            - text: . Incorrect metrics could pass through the system without triggering errors, making failures hard to detect.
        - listitem [ref=f44e146]:
          - text: •
          - paragraph [ref=f44e147]:
            - strong [ref=f44e148]: Operational complexity
            - text: . Debugging required inspecting multiple systems without a single source of truth for pipeline health.
      - paragraph [ref=f44e149]: These limitations made it difficult to operate AI pipelines with confidence at higher throughput.
      - heading "Why GlassFlow" [level=2] [ref=f44e150]
      - paragraph [ref=f44e151]: Nubrain evaluated GlassFlow to address the gaps left by Kafka table engines and custom transformation code.
      - paragraph [ref=f44e152]: "GlassFlow stood out because it provided:"
      - list [ref=f44e153]:
        - listitem [ref=f44e154]:
          - text: •
          - paragraph [ref=f44e155]:
            - text: Native support for
            - strong [ref=f44e156]: stateful streaming transformations
            - text: .
        - listitem [ref=f44e157]:
          - text: •
          - paragraph [ref=f44e158]:
            - text: Built-in
            - strong [ref=f44e159]: pipeline-level observability and metrics
            - text: .
        - listitem [ref=f44e160]:
          - text: •
          - paragraph [ref=f44e161]:
            - strong [ref=f44e162]: Dead-letter queues
            - text: to isolate and inspect failing records.
        - listitem [ref=f44e163]:
          - text: •
          - paragraph [ref=f44e164]: A scalable, self-hosted architecture suitable for production workloads.
        - listitem [ref=f44e165]:
          - text: •
          - paragraph [ref=f44e166]: Full data ownership, with all data remaining inside Nubrain’s infrastructure.
      - heading "Solution" [level=2] [ref=f44e167]
      - paragraph [ref=f44e168]: Nubrain adopted GlassFlow to replace their Kafka table engine and custom transformation code with a simpler and more reliable streaming architecture.
      - paragraph [ref=f44e169]: "GlassFlow was selected because it provided:"
      - list [ref=f44e170]:
        - listitem [ref=f44e171]:
          - text: •
          - paragraph [ref=f44e172]: Native support for stateful streaming transformations.
        - listitem [ref=f44e173]:
          - text: •
          - paragraph [ref=f44e174]: Built-in pipeline-level observability and metrics.
        - listitem [ref=f44e175]:
          - text: •
          - paragraph [ref=f44e176]: Dead-letter queues to isolate and inspect failing records.
        - listitem [ref=f44e177]:
          - text: •
          - paragraph [ref=f44e178]: A scalable, self-hosted architecture suitable for production workloads.
        - listitem [ref=f44e179]:
          - text: •
          - paragraph [ref=f44e180]: Full data ownership, with all data remaining inside Nubrain’s infrastructure.
      - paragraph [ref=f44e181]: "GlassFlow was implemented as the core processing layer of Nubrain’s data pipelines. The new setup includes:"
      - list [ref=f44e182]:
        - listitem [ref=f44e183]:
          - text: •
          - paragraph [ref=f44e184]: Stateful transformations to validate, normalize, and aggregate agent output.
        - listitem [ref=f44e185]:
          - text: •
          - paragraph [ref=f44e186]: Deduplication logic to ensure metric correctness.
        - listitem [ref=f44e187]:
          - text: •
          - paragraph [ref=f44e188]: Dead-letter queues to prevent silent propagation of invalid data.
        - listitem [ref=f44e189]:
          - text: •
          - paragraph [ref=f44e190]: Pipeline metrics to monitor throughput, retries, latency, and failures.
        - listitem [ref=f44e191]:
          - text: •
          - paragraph [ref=f44e192]: A simpler operational model with fewer custom components.
      - paragraph [ref=f44e193]: GlassFlow was integrated quickly and required minimal ongoing maintenance.
