        - paragraph [ref=f294e1690] [cursor=pointer]: Why do I need an observability layer for my agents?
        - paragraph [ref=f294e1695]: Because agents fail differently than traditional software and you find out about it differently too. A traditional API either returns a 200 or a 500. You know immediately. An agent can run for 40 minutes, produce a confident-sounding output, charge you $12 in API costs, and be completely wrong the entire time. Or it can crash at step 190 of a 200-step run and leave you with no record of what happened because the spans were still in memory when the process died.
