    - generic [ref=f147e123]:
      - generic [ref=f147e124]:
        - heading "Privacy Policy" [level=1] [ref=f147e126]
        - paragraph [ref=f147e128]: "This privacy notice for GlassFlow GmbH ('we', 'us', or 'our'), describes how and why we might collect, store, use, and/or share ('process') your information when you use our services ('Services'), such as when you: Visit our website at https://www.glassflow.dev/, or any website of ours that links to this privacy notice Engage with us in other related ways, including any sales, marketing, or events Questions or concerns? Reading this privacy notice will help you understand your privacy rights and choices. If you do not agree with our policies and practices, please do not use our Services. If you still have any questions or concerns, please contact us at privacy@glassflow.dev."
      - generic [ref=f147e129]:
        - heading "Summary of key points" [level=1] [ref=f147e131]
        - paragraph [ref=f147e133]: This summary provides key points from our privacy notice, but you can find out more details about any of these topics by clicking the link following each key point or by using our table of contents below to find the section you are looking for.What personal information do we process? When you visit, use, or navigate our Services, we may process personal information depending on how you interact with us and the Services, the choices you make, and the products and features you use. Learn more about personal information you disclose to us.Do we process any sensitive personal information? We do not process sensitive personal information.Do we receive any information from third parties? We do not receive any information from third parties.How do we process your information? We process your information to provide, improve, and administer our Services, communicate with you, for security and fraud prevention, and to comply with law. We may also process your information for other purposes with your consent. We process your information only when we have a valid legal reason to do so. Learn more aboutÂ how we process your information.In what situations and with which parties do we share personal information? We may share information in specific situations and with specific third parties. Learn more aboutÂ when and with whom we share your personal information.How do we keep your information safe? We have organizational and technical processes and procedures in place to protect your personal information. However, no electronic transmission over the internet or information storage technology can be guaranteed to be 100% secure, so we cannot promise or guarantee that hackers, cybercriminals, or other unauthorized third parties will not be able to defeat our security and improperly collect, access, steal, or modify your information. Learn more about how we keep your information safe.What are your rights? Depending on where you are located geographically, the applicable privacy law may mean you have certain rights regarding your personal information. Learn more about your privacy rights.How do you exercise your rights? The easiest way to exercise your rights is by submitting a data subject access request or by contacting us. We will consider and act upon any request in accordance with applicable data protection laws.Want to learn more about what we do with any information we collect? Review the privacy notice in full.
      - generic [ref=f147e134]:
        - list [ref=f147e136]:
          - listitem [ref=f147e137]:
            - heading "What information do we collect?" [level=1] [ref=f147e138]
        - generic [ref=f147e139]:
          - paragraph [ref=f147e140]:
            - text: Personal information you disclose to us
            - strong [ref=f147e141]: "In Short:"
            - text: "We collect personal information that you provide to us.We collect personal information that you voluntarily provide to us when you register on the Services, express an interest in obtaining information about us or our products and Services, when you participate in activities on the Services, or otherwise when you contact us.Personal Information Provided by You. The personal information that we collect depends on the context of your interactions with us and the Services, the choices you make, and the products and features you use. The personal information we collect may include the following: names, email addresses, job titles, usernames, passwords, phone numbers, mailing addresses, contact preferences contact or authentication data billing addresses, debit/credit card numbersSensitive Information. We do not process sensitive information.Payment Data. We may collect data necessary to process your payment if you make purchases, such as your payment instrument number and the security code associated with your payment instrument. All payment data is stored by Stripe. You may find their privacy notice link(s) here: https://stripe.com/en-gb-de/privacy.Social Media Login Data. We may provide you with the option to register with us using your existing social media account details, like your Facebook, Twitter, or other social media account. If you choose to register in this way, we will collect the information described in the section called 'HOW DO WE HANDLE YOUR SOCIAL LOGINS?' below.All personal information that you provide to us must be true, complete, and accurate, and you must notify us of any changes to such personal information.Information automatically collected"
            - strong [ref=f147e142]: "In Short:"
            - text: "Some information — such as your Internet Protocol (IP) address and/or browser and device characteristics — is collected automatically when you visit our Services.We automatically collect certain information when you visit, use, or navigate the Services. This information does not reveal your specific identity (like your name or contact information) but may include device and usage information, such as your IP address, browser and device characteristics, operating system, language preferences, referring URLs, device name, country, location, information about how and when you use our Services, and other technical information. This information is primarily needed to maintain the security and operation of our Services, and for our internal analytics and reporting purposes.Like many businesses, we also collect information through cookies and similar technologies.The information we collect includes: Log and Usage Data. Log and usage data is service-related, diagnostic, usage, and performance information our servers automatically collect when you access or use our Services, and which we record in log files. Depending on how you interact with us, this log data may include your IP address, device information, browser type, and settings and information about your activity in the Services (such as the date/time stamps associated with your usage, pages and files viewed, searches, and other actions you take such as which features you use), device event information (such as system activity, error reports (sometimes called 'crash dumps'), and hardware settings). Device Data. We collect device data such as information about your computer, phone, tablet, or other device you use to access the Services. Depending on the device used, this device data may include information such as your IP address (or proxy server), device and application identification numbers, location, browser type, hardware model, Internet service provider and/or mobile carrier, operating system, and system configuration information."
          - paragraph [ref=f147e143]
          - paragraph [ref=f147e144]: Coding agent sessions (Rius for Claude Code)
          - paragraph [ref=f147e145]
          - paragraph [ref=f147e146]: The Rius plugin for Claude Code sends your Claude Code sessions to your Rius workspace, so you and your team can see them. It works in Claude Code, and in beta for Codex and Cursor.
          - paragraph [ref=f147e147]
          - paragraph [ref=f147e148]: Nothing is sent until you turn it on. You sign in with /rius:login, then choose each folder with /rius:enable-here (structure only) or /rius:enable-content-here (with content).
          - paragraph [ref=f147e149]: "Structure only (the default):"
          - list [ref=f147e150]:
            - listitem [ref=f147e151]:
              - text: •
              - paragraph [ref=f147e152]: models, token counts, timing, and success
            - listitem [ref=f147e153]:
              - text: •
              - paragraph [ref=f147e154]: tool names and short error types
            - listitem [ref=f147e155]:
              - text: •
              - paragraph [ref=f147e156]: subagent types
            - listitem [ref=f147e157]:
              - text: •
              - paragraph [ref=f147e158]: the folder path, git branch, and Claude Code version
            - listitem [ref=f147e159]:
              - text: •
              - paragraph [ref=f147e160]: a random session id
          - paragraph [ref=f147e161]
          - paragraph [ref=f147e162]: No prompts, replies, file contents or command output.
          - paragraph [ref=f147e163]
          - paragraph [ref=f147e164]: "With content (opt-in, per folder): everything above, plus your prompts, Claude's replies, tool inputs and outputs (including file contents and command output), and the session title. Claude's hidden reasoning is never sent. Secrets the plugin recognizes are replaced before anything leaves your machine, and reads of files like .env, *.pem, and id_rsa are dropped. This is best effort."
          - paragraph [ref=f147e165]
          - paragraph [ref=f147e166]: "Sign-in: We receive your computer's hostname and the request IP. Your account name and email are handled by Auth0."
          - paragraph [ref=f147e167]
          - paragraph [ref=f147e168]: While a session runs, a small heartbeat is emitted every 15 seconds for up to 12 hours.
          - paragraph [ref=f147e169]: "Who sees it: members of the workspace you chose. GlassFlow staff only to run and support the service."
          - paragraph [ref=f147e170]
          - paragraph [ref=f147e171]: "What we use it for: only to show your sessions, compute usage, and API-equivalent cost, run your alerts, and answer your questions through the MCP server. It is not sold, and not used to train AI models. If root-cause analysis is enabled, traces in that workspace are analyzed by an Anthropic model."
          - paragraph [ref=f147e172]: "Where it's stored: in the EU - ClickHouse Cloud in Frankfurt and DigitalOcean in Amsterdam."
          - paragraph [ref=f147e173]
          - paragraph [ref=f147e174]: "How long we keep it: as described in your plan. Deletion on request, by emailing the privacy contact from your account email address."
          - paragraph [ref=f147e175]: "How to stop and disconnect:"
          - list [ref=f147e176]:
            - listitem [ref=f147e177]:
              - text: •
              - paragraph [ref=f147e178]: /rius:off stops one session
            - listitem [ref=f147e179]:
              - text: •
              - paragraph [ref=f147e180]: /rius:disable-here stops a folder
            - listitem [ref=f147e181]:
              - text: •
              - paragraph [ref=f147e182]: /rius:logout revokes the key within about a minute
            - listitem [ref=f147e183]:
              - text: •
              - paragraph [ref=f147e184]: then /plugin uninstall rius, and delete ~/.claude/rius
          - paragraph [ref=f147e185]
