    - generic [ref=f27e225]:
      - heading "Frequently Asked Questions" [level=2] [ref=f27e227]
      - generic [ref=f27e228]:
        - button "What is GlassFlow?" [expanded] [ref=f27e229] [cursor=pointer]
        - paragraph [ref=f27e234]: "GlassFlow is the data infrastructure for AI agents in production. It has two products: GlassFlow Tares, which feeds agents correlated data from every system they touch, and GlassFlow Rius, which traces and debugs what agents do once they’re running."
      - generic [ref=f27e235]:
        - button "What’s the difference between GlassFlow Tares and GlassFlow Rius?" [ref=f27e236] [cursor=pointer]
        - paragraph [ref=f27e239]: "GlassFlow Tares handles the data going into the agent, preparing and delivering exactly what each agent needs. GlassFlow Rius handles the data coming out: tracing, metrics, and debugging for agents in production. You can use either on its own or both together."
      - generic [ref=f27e240]:
        - button "Is GlassFlow open source?" [ref=f27e241] [cursor=pointer]
        - paragraph [ref=f27e244]: Yes. GlassFlow Tares is open source and self-hostable on your own infrastructure. A managed Cloud tier is available when you’d rather not run it yourself.
      - generic [ref=f27e245]:
        - button "What makes GlassFlow different for long-running agents?" [ref=f27e246] [cursor=pointer]
        - paragraph [ref=f27e249]: Most observability tools were built for short chat sessions and only compute metrics on completed traces. GlassFlow is built for agents that run for hours or days with live metrics on running agents, heartbeat detection for frozen ones, and unlimited retention so you can always reconstruct what happened.
