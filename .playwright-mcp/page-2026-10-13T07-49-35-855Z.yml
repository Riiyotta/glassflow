    - generic [ref=f21e82]:
      - generic [ref=f21e86]:
        - paragraph [ref=f21e95]: “I am happy we found GlassFlow. I was fed up seeing my engineers debugging broken observability pipelines and spending their time creating custom solutions, while our focus should have been on improving our own product.”
        - generic [ref=f21e100]:
          - paragraph [ref=f21e102]: Andres Tapia,
          - paragraph [ref=f21e104]: CEO, Restack
      - heading "Results" [level=2] [ref=f21e108]
      - paragraph [ref=f21e109]: "After going live with GlassFlow, Restack observed:"
      - list [ref=f21e110]:
        - listitem [ref=f21e111]:
          - text: •
          - paragraph [ref=f21e112]: 84% reduction in engineering effort for building and maintaining pipelines.
        - listitem [ref=f21e113]:
          - text: •
          - paragraph [ref=f21e114]: 87% reduction in pipeline-related incidents.
        - listitem [ref=f21e115]:
          - text: •
          - paragraph [ref=f21e116]: Stable ingestion of approximately 10 TB of data per day.
        - listitem [ref=f21e117]:
          - text: •
          - paragraph [ref=f21e118]: Support for new real-time observability and alerting use cases, like
          - list [ref=f21e119]:
            - listitem [ref=f21e120]:
              - text: •
              - paragraph [ref=f21e121]: alerting when CPU > 85% for 3 mins on any node or
            - listitem [ref=f21e122]:
              - text: •
              - paragraph [ref=f21e123]: the p99 latency is > 500ms for /checkout in prod.
      - paragraph [ref=f21e124]: GlassFlow removed operational complexity and allowed the team to focus on core platform development.
      - heading "Key takeaways:" [level=2] [ref=f21e125]
      - list [ref=f21e126]:
        - listitem [ref=f21e127]:
          - text: •
          - paragraph [ref=f21e128]: Built real-time, enterprise-grade observability without relying on Kafka table engines or slow merge patterns
        - listitem [ref=f21e129]:
          - text: •
          - paragraph [ref=f21e130]: Reduced pipeline engineering effort by 84% and incidents by 87%
        - listitem [ref=f21e131]:
          - text: •
          - paragraph [ref=f21e132]: Ingesting 10 TB every day from Kafka to ClickHouse (self-hosted)
      - heading "Challenge - Real-time Observability" [level=2] [ref=f21e133]
      - paragraph [ref=f21e134]: Restack needed reliable real-time observability for their platform and for their enterprise customers. Their existing setup was based on Kafka, a Kafka table engine, and custom Python transformation code.
      - paragraph [ref=f21e135]: "This approach caused several problems:"
      - list [ref=f21e136]:
        - listitem [ref=f21e137]:
          - text: •
          - paragraph [ref=f21e138]: Transformations were implemented as stateless Python code, which required significant ongoing maintenance.
        - listitem [ref=f21e139]:
          - text: •
          - paragraph [ref=f21e140]: Limited visibility into pipeline behavior made debugging difficult.
        - listitem [ref=f21e141]:
          - text: •
          - paragraph [ref=f21e142]: Pipelines would break intermittently without clear insight into root causes.
        - listitem [ref=f21e143]:
          - text: •
          - paragraph [ref=f21e144]: Heavy reliance on ReplacingMergeTree and FINAL made queries too slow for real-time observability and alerting.
        - listitem [ref=f21e145]:
          - text: •
          - paragraph [ref=f21e146]: Ensuring availability for enterprise customers became increasingly difficult.
      - paragraph [ref=f21e147]: As ingestion volume increased, this architecture became fragile and expensive to operate.
      - heading "Solution" [level=2] [ref=f21e148]
      - paragraph [ref=f21e149]: Restack adopted GlassFlow to simplify their streaming architecture while meeting strict real-time observability requirements.
      - paragraph [ref=f21e150]: "GlassFlow was selected because it allowed Restack to:"
      - list [ref=f21e151]:
        - listitem [ref=f21e152]:
          - text: •
          - paragraph [ref=f21e153]: Consume and transform approximately 6.7 billion messages per day.
        - listitem [ref=f21e154]:
          - text: •
          - paragraph [ref=f21e155]: Produce query-ready data without relying on ReplacingMergeTree or FINAL.
        - listitem [ref=f21e156]:
          - text: •
          - paragraph [ref=f21e157]: Enable real-time alerting on streaming data.
        - listitem [ref=f21e158]:
          - text: •
          - paragraph [ref=f21e159]: Expose built-in pipeline metrics.
        - listitem [ref=f21e160]:
          - text: •
          - paragraph [ref=f21e161]: Export metrics via OpenTelemetry and visualize them in Grafana.
        - listitem [ref=f21e162]:
          - text: •
          - paragraph [ref=f21e163]: Use dead-letter queues to isolate failures instead of breaking pipelines.
      - paragraph [ref=f21e164]: "GlassFlow was implemented as the core of Restack’s observability data pipeline. The implementation included:"
      - list [ref=f21e165]:
        - listitem [ref=f21e166]:
          - text: •
          - paragraph [ref=f21e167]: Stateless streaming transformations.
        - listitem [ref=f21e168]:
          - text: •
          - paragraph [ref=f21e169]: Deduplication over a seven-day time window.
        - listitem [ref=f21e170]:
          - text: •
          - paragraph [ref=f21e171]: Dead-letter queues to handle malformed or failing records.
        - listitem [ref=f21e172]:
          - text: •
          - paragraph [ref=f21e173]: Pipeline-level metrics exposed via OpenTelemetry.
      - paragraph [ref=f21e174]: The full rollout was completed in fifteen days and required minimal changes to downstream consumers.
