      - generic [ref=f130e86]:
        - paragraph [ref=f130e95]: “GlassFlow helped eliminate silent failures in our pipelines. Dead-letter queues and pipeline metrics significantly improved reliability while keeping everything self-hosted.”
        - generic [ref=f130e100]:
          - paragraph [ref=f130e102]: Ingo Marquardt,
          - paragraph [ref=f130e104]: CTO, Nubrain
      - heading "Results" [level=2] [ref=f130e108]
      - paragraph [ref=f130e109]: "With GlassFlow in production, Nubrain achieved:"
      - list [ref=f130e110]:
        - listitem [ref=f130e111]:
          - text: •
          - paragraph [ref=f130e112]: Correct and consistent metrics due to stateful transformations and deduplication logic.
        - listitem [ref=f130e113]:
          - text: •
          - paragraph [ref=f130e114]: 93% reduction of silently duplicated or corrupted metrics that previously passed through the pipeline (measured in production pipelines).
        - listitem [ref=f130e115]:
          - text: •
          - paragraph [ref=f130e116]: Reliable handling of stateful streaming logic at scale.
        - listitem [ref=f130e117]:
          - text: •
          - paragraph [ref=f130e118]: 3x improved scalability as agent throughput increased.
        - listitem [ref=f130e119]:
          - text: •
          - paragraph [ref=f130e120]: Clear visibility into pipeline behavior and failures.
        - listitem [ref=f130e121]:
          - text: •
          - paragraph [ref=f130e122]: Stable processing of approximately 7 TB of data per day.
      - paragraph [ref=f130e123]: By introducing state into the pipeline, Nubrain was able to trust their metrics again and operate production AI workloads with significantly lower operational risk.
      - heading "Key takeaways:" [level=2] [ref=f130e124]
      - list [ref=f130e125]:
        - listitem [ref=f130e126]:
          - text: •
          - paragraph [ref=f130e127]: Eliminated silent metric corruption using stateful streaming transformations and deduplication
        - listitem [ref=f130e128]:
          - text: •
          - paragraph [ref=f130e129]: Scaled AI pipelines 3x with reliable observability while processing 7 TB of data per day
      - heading "The Challenge" [level=2] [ref=f130e130]
      - paragraph [ref=f130e131]: Nubrain’s initial data infrastructure was built on Kafka, a Kafka table engine, and self-written transformation code before ingesting to ClickHouse.
      - paragraph [ref=f130e132]: "While this setup worked for early experimentation, it exposed several fundamental limitations in production:"
      - list [ref=f130e133]:
        - listitem [ref=f130e134]:
          - text: •
          - paragraph [ref=f130e135]:
            - strong [ref=f130e136]: No support for stateful transformations
            - text: . Custom transformation code was largely stateless, making it difficult to correctly handle retries, aggregations, and validation over time windows.
        - listitem [ref=f130e137]:
          - text: •
          - paragraph [ref=f130e138]:
            - strong [ref=f130e139]: Limited scalability
            - text: . As agent activity increased, retries and reprocessing caused unpredictable load and operational overhead.
        - listitem [ref=f130e140]:
          - text: •
          - paragraph [ref=f130e141]:
            - strong [ref=f130e142]: Poor observability
            - text: . The team had limited insight into what was happening inside the pipeline, especially when data was dropped, retried, or silently corrupted.
        - listitem [ref=f130e143]:
          - text: •
          - paragraph [ref=f130e144]:
            - strong [ref=f130e145]: Silent data issues
            - text: . Incorrect metrics could pass through the system without triggering errors, making failures hard to detect.
        - listitem [ref=f130e146]:
          - text: •
          - paragraph [ref=f130e147]:
            - strong [ref=f130e148]: Operational complexity
            - text: . Debugging required inspecting multiple systems without a single source of truth for pipeline health.
      - paragraph [ref=f130e149]: These limitations made it difficult to operate AI pipelines with confidence at higher throughput.
      - heading "Why GlassFlow" [level=2] [ref=f130e150]
      - paragraph [ref=f130e151]: Nubrain evaluated GlassFlow to address the gaps left by Kafka table engines and custom transformation code.
      - paragraph [ref=f130e152]: "GlassFlow stood out because it provided:"
      - list [ref=f130e153]:
        - listitem [ref=f130e154]:
          - text: •
          - paragraph [ref=f130e155]:
            - text: Native support for
            - strong [ref=f130e156]: stateful streaming transformations
            - text: .
        - listitem [ref=f130e157]:
          - text: •
          - paragraph [ref=f130e158]:
            - text: Built-in
            - strong [ref=f130e159]: pipeline-level observability and metrics
            - text: .
        - listitem [ref=f130e160]:
          - text: •
          - paragraph [ref=f130e161]:
            - strong [ref=f130e162]: Dead-letter queues
            - text: to isolate and inspect failing records.
        - listitem [ref=f130e163]:
          - text: •
          - paragraph [ref=f130e164]: A scalable, self-hosted architecture suitable for production workloads.
        - listitem [ref=f130e165]:
          - text: •
          - paragraph [ref=f130e166]: Full data ownership, with all data remaining inside Nubrain’s infrastructure.
      - heading "Solution" [level=2] [ref=f130e167]
      - paragraph [ref=f130e168]: Nubrain adopted GlassFlow to replace their Kafka table engine and custom transformation code with a simpler and more reliable streaming architecture.
      - paragraph [ref=f130e169]: "GlassFlow was selected because it provided:"
      - list [ref=f130e170]:
        - listitem [ref=f130e171]:
          - text: •
          - paragraph [ref=f130e172]: Native support for stateful streaming transformations.
        - listitem [ref=f130e173]:
          - text: •
          - paragraph [ref=f130e174]: Built-in pipeline-level observability and metrics.
        - listitem [ref=f130e175]:
          - text: •
          - paragraph [ref=f130e176]: Dead-letter queues to isolate and inspect failing records.
        - listitem [ref=f130e177]:
          - text: •
          - paragraph [ref=f130e178]: A scalable, self-hosted architecture suitable for production workloads.
        - listitem [ref=f130e179]:
          - text: •
          - paragraph [ref=f130e180]: Full data ownership, with all data remaining inside Nubrain’s infrastructure.
      - paragraph [ref=f130e181]: "GlassFlow was implemented as the core processing layer of Nubrain’s data pipelines. The new setup includes:"
      - list [ref=f130e182]:
        - listitem [ref=f130e183]:
          - text: •
          - paragraph [ref=f130e184]: Stateful transformations to validate, normalize, and aggregate agent output.
        - listitem [ref=f130e185]:
          - text: •
          - paragraph [ref=f130e186]: Deduplication logic to ensure metric correctness.
        - listitem [ref=f130e187]:
          - text: •
          - paragraph [ref=f130e188]: Dead-letter queues to prevent silent propagation of invalid data.
        - listitem [ref=f130e189]:
          - text: •
          - paragraph [ref=f130e190]: Pipeline metrics to monitor throughput, retries, latency, and failures.
        - listitem [ref=f130e191]:
          - text: •
          - paragraph [ref=f130e192]: A simpler operational model with fewer custom components.
      - paragraph [ref=f130e193]: GlassFlow was integrated quickly and required minimal ongoing maintenance.
